[package]
name = "sparkleforge-cli"
version = "0.1.0"
edition = "2021"
authors = ["ppijbb"]
description = "Rust CLI binary for SparkleForge"

[[bin]]
name = "sparkleforge"
path = "src/main.rs"

[dependencies]
clap = { version = ">=4.0, <=4.5.20", features = ["derive"] }
tokio = { version = ">=1.0, <=1.42.0", features = ["full"] }
serde = { version = ">=1.0, <=1.0.219", features = ["derive"] }
serde_json = ">=1.0, <=1.0.140"
anyhow = ">=1.0, <=1.0.95"
