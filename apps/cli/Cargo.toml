[package]
name = "sparkleforge-cli"
version = "0.1.0"
edition = "2021"
authors = ["ppijbb"]
description = "Rust CLI binary for SparkleForge"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

