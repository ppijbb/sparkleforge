# SparkleForge Agent Evaluation Thresholds
# Standard agent evaluation criteria based on academic benchmarks

thresholds:
  # Web Navigation Performance (WebArena-style)
  navigation_success_rate: 0.95  # 95% successful navigation
  information_accuracy: 0.95  # 95% accurate information retrieval
  page_load_success_rate: 0.95  # 95% successful page loads
  search_query_effectiveness: 0.95  # 95% effective search queries
  
  # Tool Usage Performance (ToolBench-style)
  tool_usage_success_rate: 0.95  # 95% successful tool usage
  tool_coordination_efficiency: 0.95  # 95% efficient tool coordination
  output_quality: 0.95  # 95% high-quality outputs
  error_recovery_rate: 0.95  # 95% successful error recovery
  
  # Multi-Agent Collaboration (AgentBench-style)
  coordination_efficiency: 0.95  # 95% efficient agent coordination
  task_completion_rate: 0.95  # 95% task completion rate
  result_consistency: 0.95  # 95% consistent results across agents
  conflict_resolution_rate: 0.95  # 95% successful conflict resolution
  agent_satisfaction: 0.95  # 95% agent satisfaction score
  
  # Reasoning and Planning (ALFWorld-style)
  reasoning_accuracy: 0.95  # 95% accurate reasoning
  logical_consistency: 0.95  # 95% logical consistency
  conclusion_validity: 0.95  # 95% valid conclusions
  plan_feasibility: 0.95  # 95% feasible plans
  strategy_quality: 0.95  # 95% high-quality strategies
  
  # Agent Performance Metrics
  execution_efficiency: 0.95  # 95% execution efficiency
  resource_utilization: 0.95  # 95% optimal resource utilization
  scalability_score: 0.95  # 95% scalability performance
  reliability_score: 0.95  # 95% system reliability
  
  # Loop Engineering Metrics
  loop_stagnation_rate: 0.0  # Max 0% stagnation (S++ Tier)
  iteration_budget_efficiency: 0.95  # Min 95% efficiency
  circular_call_detection_rate: 0.95  # Min 95% detection
  strategy_reset_success_rate: 0.95  # Min 95% success
  
  # Task-Specific Thresholds
  min_sources: 5  # minimum sources per task
  max_execution_time: 300  # maximum execution time (seconds)
  success_rate: 0.95  # overall success rate threshold
  quality_score: 0.95  # overall quality score threshold

# Weighted scoring for overall benchmark score
scoring_weights:
  research_quality: 0.25
  performance: 0.15
  source_validation: 0.15
  creative_insights: 0.15
  memory_learning: 0.1
  loop_engineering: 0.1
  collaboration: 0.1

# Regression detection thresholds
regression_thresholds:
  performance_degradation: 0.1  # 10% performance degradation triggers regression
  quality_degradation: 0.05  # 5% quality degradation triggers regression
  new_failures: 1  # Any new test failures trigger regression

# Benchmark categories and their importance
category_weights:
  critical: 1.0  # Must pass for overall success
  important: 0.8  # High weight in overall score
  nice_to_have: 0.5  # Lower weight in overall score

# Test case categories
test_categories:
  research_quality:
    weight: 1.0
    required_tests: ["tech-001", "science-001"]
  performance:
    weight: 0.8
    required_tests: ["tech-001", "business-001"]
  creative_insights:
    weight: 0.8
    required_tests: ["creative-001", "health-001"]
  source_validation:
    weight: 1.0
    required_tests: ["science-001", "health-001"]
  memory_learning:
    weight: 0.6
    required_tests: ["tech-001", "business-001"]
