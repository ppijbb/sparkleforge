name: Claude Auto Fix PR

on:
  push:
    branches:
      - 'chore/**'
      - main
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Existing issue number to fix. Leave empty to analyze the latest pushed diff.'
        required: false
        type: string

concurrency:
  group: claude-auto-fix-${{ github.ref || github.run_id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  analyze-push:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.issue_number == '')
    runs-on: ubuntu-latest
    outputs:
      should_fix: ${{ steps.read_task.outputs.should_fix }}
      issue_title: ${{ steps.read_task.outputs.issue_title }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Capture pushed diff
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            git diff --unified=80 "${{ github.event.before }}" "${{ github.sha }}" > pushed.diff || true
          else
            git diff --unified=80 HEAD~1 HEAD > pushed.diff || true
          fi
          if [ ! -s pushed.diff ]; then
            echo "No diff found." > pushed.diff
          fi

      - name: Analyze diff with Claude
        uses: anthropics/claude-code-base-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read pushed.diff and decide whether this push introduced a concrete issue that should be fixed in code.

            Write claude-task.json with this exact JSON shape:
            {
              "should_fix": true or false,
              "title": "short GitHub issue title",
              "body": "GitHub issue body with the concrete problem, affected files, and expected fix"
            }

            Set should_fix to true only for correctness, security, test, packaging, or workflow issues.
            Set should_fix to false for style-only feedback, empty diffs, vague suggestions, or already-correct code.
          allowed_tools: "Read,Write,Grep,Glob"
          max_turns: "6"

      - name: Read analysis result
        id: read_task
        run: |
          if [ ! -f claude-task.json ]; then
            echo "should_fix=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SHOULD_FIX=$(jq -r '.should_fix // false' claude-task.json)
          TITLE=$(jq -r '.title // "AI fix: issue found in pushed diff"' claude-task.json)
          BODY=$(jq -r '.body // empty' claude-task.json)

          {
            echo "$BODY"
            echo
            echo "Source run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Source commit: ${{ github.sha }}"
          } > claude-issue-body.md

          echo "should_fix=$SHOULD_FIX" >> "$GITHUB_OUTPUT"
          echo "issue_title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-analysis
          path: |
            claude-task.json
            claude-issue-body.md

  create-issue:
    needs: analyze-push
    if: needs.analyze-push.outputs.should_fix == 'true'
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.create.outputs.issue_number }}
      issue_url: ${{ steps.create.outputs.issue_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: claude-analysis

      - name: Create issue
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create automated-issue \
            --repo "${{ github.repository }}" \
            --description "Created by repository automation" \
            --color 5319e7 || true
          gh label create triage-needed \
            --repo "${{ github.repository }}" \
            --description "Needs human triage" \
            --color fbca04 || true

          ISSUE_URL=$(gh issue create \
            --repo "${{ github.repository }}" \
            --title "${{ needs.analyze-push.outputs.issue_title }}" \
            --body-file claude-issue-body.md \
            --label automated-issue \
            --label triage-needed)
          ISSUE_NUMBER=${ISSUE_URL##*/}
          echo "issue_url=$ISSUE_URL" >> "$GITHUB_OUTPUT"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

  resolve-manual-issue:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.issue_number != ''
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.issue.outputs.issue_number }}
      issue_url: ${{ steps.issue.outputs.issue_url }}
    steps:
      - name: Resolve issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_NUMBER="${{ github.event.inputs.issue_number }}"
          ISSUE_URL=$(gh issue view "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --json url \
            --jq '.url')
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "issue_url=$ISSUE_URL" >> "$GITHUB_OUTPUT"

  open-pr-and-fix:
    needs: [create-issue, resolve-manual-issue]
    if: >-
      always() &&
      ((needs.create-issue.outputs.issue_number != '') ||
      (needs.resolve-manual-issue.outputs.issue_number != ''))
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      pr_url: ${{ steps.pr.outputs.pr_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Determine issue and branch
        id: context
        run: |
          ISSUE_NUMBER="${{ needs.create-issue.outputs.issue_number || needs.resolve-manual-issue.outputs.issue_number }}"
          ISSUE_URL="${{ needs.create-issue.outputs.issue_url || needs.resolve-manual-issue.outputs.issue_url }}"

          if [ "${{ github.ref_name }}" = "main" ]; then
            FIX_BRANCH="ai-fix/$ISSUE_NUMBER-${{ github.run_id }}"
            git checkout -B "$FIX_BRANCH"
          else
            FIX_BRANCH="${{ github.ref_name }}"
          fi

          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "issue_url=$ISSUE_URL" >> "$GITHUB_OUTPUT"
          echo "branch=$FIX_BRANCH" >> "$GITHUB_OUTPUT"
          echo "start_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open or find pull request before fixing
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create ai-generated \
            --repo "${{ github.repository }}" \
            --description "Generated by AI automation" \
            --color 1d76db || true
          gh label create review-needed \
            --repo "${{ github.repository }}" \
            --description "Needs human review" \
            --color d93f0b || true

          EXISTING_PR=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "${{ steps.context.outputs.branch }}" \
            --base main \
            --state open \
            --json number,url \
            --jq '.[0] // empty')

          if [ -n "$EXISTING_PR" ]; then
            PR_NUMBER=$(echo "$EXISTING_PR" | jq -r '.number')
            PR_URL=$(echo "$EXISTING_PR" | jq -r '.url')
          else
            if [ "${{ github.ref_name }}" = "main" ]; then
              git commit --allow-empty -m "🔧 chore: start auto-fix for issue #${{ steps.context.outputs.issue_number }} on main"
              git push --set-upstream origin "${{ steps.context.outputs.branch }}"
            fi

            PR_URL=$(gh pr create \
              --repo "${{ github.repository }}" \
              --base main \
              --head "${{ steps.context.outputs.branch }}" \
              --title "fix: address issue #${{ steps.context.outputs.issue_number }}" \
              --body "Automated fix PR for ${{ steps.context.outputs.issue_url }}.

          Closes #${{ steps.context.outputs.issue_number }}

          Source run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --label ai-generated \
              --label review-needed)
            PR_NUMBER=${PR_URL##*/}
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Write issue context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue view "${{ steps.context.outputs.issue_number }}" \
            --repo "${{ github.repository }}" \
            --json title,body,url \
            --jq '"# " + .title + "\n\n" + (.body // "") + "\n\n" + .url' > issue-context.md

      - name: Fix issue with Claude
        uses: anthropics/claude-code-base-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Fix GitHub issue #${{ steps.context.outputs.issue_number }} on the current branch.

            The pull request already exists: ${{ steps.pr.outputs.pr_url }}
            The issue context is in issue-context.md.

            Implement a small, focused fix. Run relevant lightweight checks if practical.
            Do not commit, push, merge, or create another pull request; the workflow will do that after your edits.
          allowed_tools: "Read,Edit,Write,Grep,Glob,Bash(git diff),Bash(git status),Bash(uv run pytest),Bash(pytest)"
          max_turns: "12"

      - name: Commit and push Claude changes
        id: commit
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            ':!issue-context.md' \
            ':!pushed.diff' \
            ':!claude-task.json' \
            ':!claude-issue-body.md'
          git commit -m "🔧 chore: address issue #${{ steps.context.outputs.issue_number }} via Claude automation"
          git push origin "${{ steps.context.outputs.branch }}"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

  merge-auto-fix:
    needs: open-pr-and-fix
    if: needs.open-pr-and-fix.outputs.pr_number != ''
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge when repository rules allow it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ needs.open-pr-and-fix.outputs.pr_number }}" \
            --repo "${{ github.repository }}" \
            --auto \
            --squash || true
