name: Gemini AI Assistant
on:
  push:
    branches:
      - 'chore/**'
      - main
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  gemini-harness:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Auto Label & Assign PR
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 기본 라벨 부착 및 본인(actor)을 담당자로 지정
          gh pr edit ${{ github.event.pull_request.number }} \
            --add-label "triage-needed, review-needed" \
            --add-assignee "${{ github.actor }}"

      - name: Run Gemini CLI Assistant
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          model: gemini-3.1-flash-lite-preview
          system_instruction: |
            You are the SparkleForge Harness. 
            Refer to GEMINI.md in the repository root for your specific interaction rules and conventions.
            Your goal is to automate issue creation, code fixes, and task assignment based on feedback from other AIs or humans.
