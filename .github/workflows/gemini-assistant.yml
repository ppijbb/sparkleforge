name: AI Harness (Distributed)
on:
  push:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1단계: 코드 변경점 리뷰 (OpenRouter / Groq 등 무료 API 직접 호출)
  code-review:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Extract Git Diff
        run: git diff HEAD~1 HEAD > diff.txt || echo "" > diff.txt
        
      - name: OpenRouter Diff Review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "No OpenRouter key found, skipping."
            echo "Skipped" > review_result.txt
            exit 0
          fi
          
          # jq를 사용하여 안전하게 JSON 페이로드 생성 (따옴표 이스케이프 문제 방지)
          jq -n --arg diff "$(cat diff.txt)" '{
            model: "nvidia/nemotron-3-super-120b-a12b:free", 
            messages: [
              {role: "system", content: "You are an expert code reviewer. Read the git diff and summarize key issues, bugs, or style violations briefly."},
              {role: "user", content: $diff}
            ]
          }' > payload.json
          
          # curl을 통해 직접 API 찌르기
          RAW_RESPONSE=$(curl -s -X POST "https://openrouter.ai/api/v1/chat/completions" \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d @payload.json || true)
          if [ -z "$RAW_RESPONSE" ]; then
            echo "Skipped: OpenRouter returned an empty response." > review_result.txt
            exit 0
          fi
          if echo "$RAW_RESPONSE" | jq -e '.error' >/dev/null 2>&1; then
            ERROR_MESSAGE=$(echo "$RAW_RESPONSE" | jq -r '.error.message // .error')
            echo "Skipped: OpenRouter API error: $ERROR_MESSAGE" > review_result.txt
            exit 0
          fi
          CONTENT=$(echo "$RAW_RESPONSE" | jq -r '.choices[0].message.content // empty' 2>/dev/null || true)
          if [ -z "$CONTENT" ] || [ "$CONTENT" = "null" ]; then
            echo "Skipped: OpenRouter returned no review content." > review_result.txt
            exit 0
          fi
          printf '%s\n' "$CONTENT" > review_result.txt
            
      - name: Cerebras Diff Review
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          if [ -z "$CEREBRAS_API_KEY" ]; then
            echo "No Cerebras key found, skipping."
            echo "Skipped" > cerebras_result.txt
            exit 0
          fi
          
          jq -n --arg diff "$(cat diff.txt)" '{
            model: "zai-glm-4.7",
            messages: [
              {role: "system", content: "You are a security and architecture reviewer. Read this diff and point out critical logical or security flaws only."},
              {role: "user", content: $diff}
            ]
          }' > cerebras_payload.json
          
          RAW_RESPONSE=$(curl -s -X POST "https://api.cerebras.ai/v1/chat/completions" \
            -H "Authorization: Bearer $CEREBRAS_API_KEY" \
            -H "Content-Type: application/json" \
            -d @cerebras_payload.json || true)
          if [ -z "$RAW_RESPONSE" ]; then
            echo "Skipped: Cerebras returned an empty response." > cerebras_result.txt
            exit 0
          fi
          if echo "$RAW_RESPONSE" | jq -e '.error' >/dev/null 2>&1; then
            ERROR_MESSAGE=$(echo "$RAW_RESPONSE" | jq -r '.error.message // .error')
            echo "Skipped: Cerebras API error: $ERROR_MESSAGE" > cerebras_result.txt
            exit 0
          fi
          CONTENT=$(echo "$RAW_RESPONSE" | jq -r '.choices[0].message.content // empty' 2>/dev/null || true)
          if [ -z "$CONTENT" ] || [ "$CONTENT" = "null" ]; then
            echo "Skipped: Cerebras returned no review content." > cerebras_result.txt
            exit 0
          fi
          printf '%s\n' "$CONTENT" > cerebras_result.txt

      - name: Leave PR review summary
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## OpenCode review seed"
            echo
            echo "### OpenRouter"
            cat review_result.txt
            echo
            echo "### Cerebras"
            cat cerebras_result.txt
            echo
            echo "_This comment is used by the issue triage job to create follow-up work._"
          } > review-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body-file review-comment.md
            
      - name: Upload Review Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: review-results
          path: |
            review_result.txt
            cerebras_result.txt

  # 2단계: 리뷰 분석 및 작업 분할/이슈 생성 (Groq / Cerebras API 직접 호출)
  issue-triage:
    needs: code-review
    if: >-
      always() &&
      needs.code-review.result == 'success' &&
      (github.event_name == 'pull_request' || github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: write
    outputs:
      issue_url: ${{ steps.create_issue.outputs.issue_url }}
      issue_number: ${{ steps.create_issue.outputs.issue_number }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Review Artifact
        uses: actions/download-artifact@v4
        with:
          name: review-results
          
      - name: Groq API Triage & Issue Create
        id: create_issue
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ secrets.PAT }}
          HAS_PAT: ${{ secrets.PAT != '' }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::error::PAT repository secret is required to create issues and dispatch opencode-auto-fix.yml as part of the automatic issue-to-PR flow."
            echo "::error::Create a PAT secret with contents, issues, pull requests, and actions write access."
            exit 1
          fi

          if [ ! -f review_result.txt ] || [ -z "$GROQ_API_KEY" ]; then
            echo "No review result or Groq key found."
            exit 0
          fi

          OPENROUTER_REVIEW=$(cat review_result.txt)
          CEREBRAS_REVIEW=$(cat cerebras_result.txt 2>/dev/null || echo '')

          if [[ "$OPENROUTER_REVIEW" == Skipped* ]] && { [ -z "$CEREBRAS_REVIEW" ] || [[ "$CEREBRAS_REVIEW" == Skipped* ]]; }; then
            echo "All AI reviews were skipped; not creating an issue."
            exit 0
          fi
          
          # 두 리뷰를 하나로 합침
          COMBINED_REVIEW="OpenRouter Review:\n$OPENROUTER_REVIEW\n\nCerebras Review:\n$CEREBRAS_REVIEW"
          
          # Groq 무료 티어 중 최고성능 모델을 통해 이슈 내용 생성
          jq -n --arg review "$COMBINED_REVIEW" \
            --arg system_msg "You are a senior developer talking to a teammate. Based on the review, generate a JSON object with 'should_create_issue', 'title', and 'body' keys. Set should_create_issue to true only when the review identifies a concrete correctness, security, packaging, workflow, or test failure that needs a code change. Set should_create_issue to false for skipped reviews, empty reviews, no-issue findings, praise, style-only feedback, vague suggestions, or uncertain problems. If should_create_issue is false, title and body must be empty strings. If true, the title must use the repository's plain Conventional Commit prefix style, such as 'fix: missing error handling in auth flow', 'feat: add retry controls', 'refactor: simplify workflow dispatch', or 'chore: update automation config'. The body should naturally explain what's wrong and how to fix it with code. No robotic headers. Just clear, peer-to-peer communication." \
            '{
              model: "llama-3.3-70b-versatile",
              messages: [
                {role: "system", content: $system_msg},
                {role: "user", content: $review}
              ],
              response_format: { type: "json_object" }
            }' > groq_payload.json
          
          # 만들어진 텍스트에서 제목과 본문 추출 (마크다운 백틱 제거 로직 포함)
          RAW_RESPONSE=$(curl -s -X POST "https://api.groq.com/openai/v1/chat/completions" \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d @groq_payload.json)
          
          if echo "$RAW_RESPONSE" | jq -e '.error' >/dev/null; then
            echo "Groq API returned an error:"
            echo "$RAW_RESPONSE" | jq -r '.error.message // .error'
            exit 1
          fi

          CONTENT=$(echo "$RAW_RESPONSE" | jq -r '.choices[0].message.content // empty')
          
          if [ -n "$CONTENT" ]; then
            if ! echo "$CONTENT" | jq -e . >/dev/null; then
              echo "Groq response content was not valid JSON; skipping issue creation."
              echo "Content preview:"
              echo "$CONTENT" | head -c 1000
              echo
              exit 0
            fi
            
            SHOULD_CREATE=$(echo "$CONTENT" | jq -r '.should_create_issue // false')
            ISSUE_TITLE=$(echo "$CONTENT" | jq -r '.title // "fix: issue identified in review"')
            ISSUE_BODY=$(echo "$CONTENT" | jq -r '.body // empty')
            ISSUE_TITLE=$(echo "$ISSUE_TITLE" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')
            case "$ISSUE_TITLE" in
              "🔧 fix:"*)
                ISSUE_TITLE="fix:${ISSUE_TITLE#*:}"
                ;;
              "✨ feature:"*)
                ISSUE_TITLE="feat:${ISSUE_TITLE#*:}"
                ;;
              "♻️ refactor:"*)
                ISSUE_TITLE="refactor:${ISSUE_TITLE#*:}"
                ;;
              "🧹 chore:"*)
                ISSUE_TITLE="chore:${ISSUE_TITLE#*:}"
                ;;
              "fix:"*|"Fix:"*)
                ISSUE_TITLE="fix:${ISSUE_TITLE#*:}"
                ;;
              "feat:"*|"Feat:"*|"feature:"*|"Feature:"*)
                ISSUE_TITLE="feat:${ISSUE_TITLE#*:}"
                ;;
              "refactor:"*|"Refactor:"*)
                ISSUE_TITLE="refactor:${ISSUE_TITLE#*:}"
                ;;
              "chore:"*|"Chore:"*)
                ISSUE_TITLE="chore:${ISSUE_TITLE#*:}"
                ;;
              *)
                ISSUE_TITLE="fix: $ISSUE_TITLE"
                ;;
            esac
            ISSUE_TYPE="${ISSUE_TITLE%%:*}"
            ISSUE_SUBJECT="${ISSUE_TITLE#*:}"
            ISSUE_SUBJECT=$(printf '%s\n' "$ISSUE_SUBJECT" | sed -E \
              -e 's/^[[:space:]]+|[[:space:]]+$//g' \
              -e 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}[[:space:]]*-[[:space:]]*//' \
              -e 's/[[:space:]]*\(#[0-9]+\)$//' \
              -e 's/[[:space:]]+/ /g' | tr '[:upper:]' '[:lower:]')
            if [ -z "$ISSUE_SUBJECT" ]; then
              ISSUE_SUBJECT="issue identified in review"
            fi
            ISSUE_TITLE="$ISSUE_TYPE: $ISSUE_SUBJECT"

            NORMALIZED_TITLE=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]')
            if [ "$SHOULD_CREATE" != "true" ]; then
              echo "Triage decided no actionable issue should be created."
              exit 0
            fi
            if [ -z "$ISSUE_TITLE" ] || [ "$ISSUE_TITLE" = "null" ] || [ -z "$ISSUE_BODY" ]; then
              echo "Triage did not provide an actionable issue title/body."
              exit 0
            fi
            if [[ "$NORMALIZED_TITLE" == *"no issue"* ]] ||
               [[ "$NORMALIZED_TITLE" == *"nothing to fix"* ]] ||
               [[ "$NORMALIZED_TITLE" == *"no actionable"* ]] ||
               [[ "$NORMALIZED_TITLE" == *"no problem"* ]]; then
              echo "Blocked non-actionable issue title: $ISSUE_TITLE"
              exit 0
            fi
            
            # 이슈 생성
            # PAT 사용 시 해당 계정으로 생성 → issues 이벤트가 다른 workflow를 트리거 가능
            # PAT 없을 경우 github.token(bot) → issues 이벤트로 다른 workflow 트리거 불가
            # 따라서 이슈 번호를 추출해 opencode-auto-fix.yml을 직접 gh workflow run으로 트리거함
            ISSUE_URL=$(gh issue create \
              --repo "${{ github.repository }}" \
              --title "$ISSUE_TITLE" \
              --body "$ISSUE_BODY" \
              --assignee "ppijbb")
            echo "Created issue: $ISSUE_URL"
            ISSUE_NUMBER="${ISSUE_URL##*/}"
            {
              echo "issue_url=$ISSUE_URL"
              echo "issue_number=$ISSUE_NUMBER"
            } >> "$GITHUB_OUTPUT"

            # GitHub Actions bot이 생성한 이슈는 issues: opened 이벤트가
            # 다른 워크플로우를 트리거하지 않으므로 직접 workflow_dispatch로 호출
            echo "Triggering opencode-auto-fix.yml for issue #$ISSUE_NUMBER ..."
            gh workflow run opencode-auto-fix.yml \
              --repo "${{ github.repository }}" \
              --field issue_number="$ISSUE_NUMBER" \
              --field max_iterations="3"
          else
            echo "Error: AI response content is empty."
            echo "Raw response: $RAW_RESPONSE"
          fi

  merge-decision:
    needs: code-review
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.pull_request.base.ref == 'dev' ||
      github.event.pull_request.base.ref == 'main') &&
      github.event.pull_request.draft == false &&
      needs.code-review.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Download Review Artifact
        uses: actions/download-artifact@v4
        with:
          name: review-results

      - name: Decide and merge PR
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ secrets.PAT }}
          HAS_PAT: ${{ secrets.PAT != '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::error::PAT repository secret is required to auto-merge reviewed PRs into dev."
            exit 1
          fi
          OPENROUTER_REVIEW=$(cat review_result.txt 2>/dev/null || echo 'Missing OpenRouter review')
          CEREBRAS_REVIEW=$(cat cerebras_result.txt 2>/dev/null || echo 'Missing Cerebras review')
          PR_META=$(gh pr view "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --json title,body,url,isDraft,mergeStateStatus,reviewDecision,headRefName,baseRefName,statusCheckRollup)
          PR_TITLE=$(echo "$PR_META" | jq -r '.title // empty')
          MERGE_SUBJECT=$(python scripts/validate_commit_messages.py --normalize-title "$PR_TITLE")
          MERGE_STATE=$(echo "$PR_META" | jq -r '.mergeStateStatus // "UNKNOWN"')
          BASE_BRANCH=$(echo "$PR_META" | jq -r '.baseRefName // "UNKNOWN"')
          NOT_READY_CHECKS=$(echo "$PR_META" | jq -r '
            [.statusCheckRollup[]? |
              select(
                (.status != "COMPLETED") or
                (.conclusion != null and
                 .conclusion != "SUCCESS" and
                 .conclusion != "SKIPPED")
              )] | length
          ')

          SHOULD_MERGE=false
          REASON="No merge decision was made."
          HAS_OPENROUTER_REVIEW=true
          HAS_CEREBRAS_REVIEW=true
          if [ -z "$OPENROUTER_REVIEW" ] ||
             [ "$OPENROUTER_REVIEW" = "null" ] ||
             [[ "$OPENROUTER_REVIEW" == Missing* ]] ||
             [[ "$OPENROUTER_REVIEW" == Skipped* ]]; then
            HAS_OPENROUTER_REVIEW=false
          fi
          if [ -z "$CEREBRAS_REVIEW" ] ||
             [ "$CEREBRAS_REVIEW" = "null" ] ||
             [[ "$CEREBRAS_REVIEW" == Missing* ]] ||
             [[ "$CEREBRAS_REVIEW" == Skipped* ]]; then
            HAS_CEREBRAS_REVIEW=false
          fi

          if [ "$HAS_OPENROUTER_REVIEW" != "true" ] && [ "$HAS_CEREBRAS_REVIEW" != "true" ]; then
            SHOULD_MERGE=true
            REASON="AI review providers returned no actionable review content; relying on GitHub mergeability and required checks."
          elif [ -z "$GROQ_API_KEY" ]; then
            SHOULD_MERGE=true
            REASON="No Groq key found for final AI gate; relying on available review comments, GitHub mergeability, and required checks."
          else

            jq -n \
              --arg meta "$PR_META" \
              --arg openrouter "$OPENROUTER_REVIEW" \
              --arg cerebras "$CEREBRAS_REVIEW" \
              --arg system_msg "You are the final merge gate for a dev branch. Return a JSON object with keys should_merge and reason. Set should_merge to true only when the reviews do not identify concrete correctness, security, workflow, packaging, or test failures that require code changes. Set should_merge to false for unresolved risks, failing checks, unclear generated changes, or any concrete issue. Do not block solely because one provider skipped or returned no content if another review is available. Keep reason concise." \
              '{
                model: "llama-3.3-70b-versatile",
                messages: [
                  {role: "system", content: $system_msg},
                  {role: "user", content: ("PR metadata:\n" + $meta + "\n\nOpenRouter review:\n" + $openrouter + "\n\nCerebras review:\n" + $cerebras)}
                ],
                response_format: { type: "json_object" }
              }' > merge_decision_payload.json

            RAW_RESPONSE=$(curl -s -X POST "https://api.groq.com/openai/v1/chat/completions" \
              -H "Authorization: Bearer $GROQ_API_KEY" \
              -H "Content-Type: application/json" \
              -d @merge_decision_payload.json)

            if echo "$RAW_RESPONSE" | jq -e '.error' >/dev/null; then
              echo "Groq API returned an error:"
              echo "$RAW_RESPONSE" | jq -r '.error.message // .error'
              exit 1
            fi

            CONTENT=$(echo "$RAW_RESPONSE" | jq -r '.choices[0].message.content // empty')
            if ! echo "$CONTENT" | jq -e . >/dev/null; then
              echo "Merge decision content was not valid JSON; skipping auto-merge."
              echo "$CONTENT" | head -c 1000
              echo
              exit 0
            fi

            SHOULD_MERGE=$(echo "$CONTENT" | jq -r '.should_merge // false')
            REASON=$(echo "$CONTENT" | jq -r '.reason // "No reason provided."')
          fi

          {
            echo "## Auto Merge Decision"
            echo
            echo "**Decision:** $SHOULD_MERGE"
            echo
            echo "**Base branch:** $BASE_BRANCH"
            echo
            echo "**Merge state:** $MERGE_STATE"
            echo
            echo "**Reason:** $REASON"
          } > merge-decision-comment.md
          gh pr comment "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --body-file merge-decision-comment.md

          if [ "$SHOULD_MERGE" != "true" ]; then
            echo "Merge decision blocked auto-merge: $REASON"
            exit 0
          fi

          if [ "$MERGE_STATE" = "DIRTY" ] || [ "$MERGE_STATE" = "BLOCKED" ] || [ "$MERGE_STATE" = "DRAFT" ]; then
            echo "PR is not currently mergeable: $MERGE_STATE"
            exit 0
          fi
          if [ "$NOT_READY_CHECKS" != "0" ]; then
            echo "PR checks are not all successful."
            exit 0
          fi

          if [ "$MERGE_STATE" = "CLEAN" ]; then
            gh pr merge "$PR_NUMBER" \
              --repo "${{ github.repository }}" \
              --squash \
              --subject "$MERGE_SUBJECT" \
              --delete-branch
          else
            gh pr merge "$PR_NUMBER" \
              --repo "${{ github.repository }}" \
              --squash \
              --subject "$MERGE_SUBJECT" \
              --auto \
              --delete-branch
          fi

  auto-merge-ready-fix-prs:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Merge ready fix PRs
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          HAS_PAT: ${{ secrets.PAT != '' }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::error::PAT repository secret is required to auto-merge ready fix PRs."
            exit 1
          fi

          DEFAULT_BRANCH=$(gh repo view "${{ github.repository }}" \
            --json defaultBranchRef \
            --jq '.defaultBranchRef.name')

          gh pr list \
            --repo "${{ github.repository }}" \
            --state open \
            --limit 100 \
            --json number,title,headRefName,baseRefName,isDraft,mergeable,mergeStateStatus,statusCheckRollup,body \
            --jq '.[] | select(.headRefName | startswith("fix/")) | @base64' |
          while read -r encoded; do
            [ -n "$encoded" ] || continue
            PR=$(echo "$encoded" | base64 -d)
            NUMBER=$(echo "$PR" | jq -r '.number')
            TITLE=$(echo "$PR" | jq -r '.title // empty')
            BASE_BRANCH=$(echo "$PR" | jq -r '.baseRefName')
            IS_DRAFT=$(echo "$PR" | jq -r '.isDraft')
            MERGEABLE=$(echo "$PR" | jq -r '.mergeable')
            MERGE_STATE=$(echo "$PR" | jq -r '.mergeStateStatus')
            MERGE_SUBJECT=$(python scripts/validate_commit_messages.py --normalize-title "$TITLE")

            if [ "$IS_DRAFT" = "true" ]; then
              echo "Skipping #$NUMBER: draft PR."
              continue
            fi
            if [ "$MERGEABLE" != "MERGEABLE" ] || [ "$MERGE_STATE" != "CLEAN" ]; then
              echo "Skipping #$NUMBER: mergeable=$MERGEABLE mergeState=$MERGE_STATE."
              continue
            fi

            NOT_READY=$(echo "$PR" | jq -r '
              [.statusCheckRollup[]? |
                select(
                  (.status != "COMPLETED") or
                  (.conclusion != null and
                   .conclusion != "SUCCESS" and
                   .conclusion != "SKIPPED")
                )] | length
            ')
            if [ "$NOT_READY" != "0" ]; then
              echo "Skipping #$NUMBER: checks are not all successful."
              continue
            fi

            echo "Merging #$NUMBER into $BASE_BRANCH."
            gh pr merge "$NUMBER" \
              --repo "${{ github.repository }}" \
              --squash \
              --subject "$MERGE_SUBJECT" \
              --delete-branch

            if [ "$BASE_BRANCH" != "$DEFAULT_BRANCH" ]; then
              BODY=$(echo "$PR" | jq -r '.body // ""')
              ISSUES=$(echo "$BODY" | grep -Eio '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' | grep -Eo '#[0-9]+' | tr -d '#' | sort -u || true)
              for ISSUE in $ISSUES; do
                gh issue comment "$ISSUE" \
                  --repo "${{ github.repository }}" \
                  --body "Fix PR #$NUMBER was merged into \`$BASE_BRANCH\`. This issue will close automatically when \`$BASE_BRANCH\` is promoted into \`$DEFAULT_BRANCH\`."
              done
            fi
          done
