name: AI Harness (Distributed)
on:
  push:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, closed]
  pull_request_review:
    types: [submitted]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route-gemini-review-feedback:
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.review.user.login == 'gemini-code-assist' &&
      github.event.review.body != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Send Gemini review feedback to linked issue
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          HAS_PAT: ${{ secrets.PAT != '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::error::PAT repository secret is required to route Gemini review feedback to OpenCode."
            exit 1
          fi

          REVIEW_BODY=$(jq -r '.review.body // ""' "$GITHUB_EVENT_PATH")
          REVIEW_URL=$(jq -r '.review.html_url // ""' "$GITHUB_EVENT_PATH")

          PR_BODY=$(gh pr view "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --json body \
            --jq '.body // ""')
          ISSUES=$(printf '%s\n' "$PR_BODY" |
            grep -Eio '(refs|close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' |
            grep -Eo '#[0-9]+' |
            tr -d '#' |
            sort -u || true)

          if [ -z "$ISSUES" ]; then
            echo "No linked issue found in PR #$PR_NUMBER body."
            exit 0
          fi

          for ISSUE in $ISSUES; do
            {
              echo "@opencode"
              echo
              echo "Gemini Code Assist left review feedback on PR #$PR_NUMBER that should be incorporated into the next automated fix attempt."
              echo
              echo "Review: $REVIEW_URL"
              echo
              printf '%s\n' '```markdown'
              printf '%s\n' "$REVIEW_BODY"
              printf '%s\n' '```'
            } > gemini-review-feedback.md

            gh issue comment "$ISSUE" \
              --repo "${{ github.repository }}" \
              --body-file gemini-review-feedback.md
          done

  # 1단계: 코드 변경점 리뷰 (SparkleForge 오케스트레이터 호출)
  code-review:
    if: >-
      (github.event_name == 'pull_request' &&
       !contains(github.event.pull_request.body, 'OpenCode-generated') &&
       !startsWith(github.event.pull_request.head.ref, 'fix/triage') &&
       !contains(github.event.pull_request.title, 'fix: triage')) ||
      (github.event_name == 'push' && !contains(github.event.head_commit.message, 'apply OpenCode changes'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Extract Git Diff
        run: git diff HEAD~1 HEAD > diff.txt || echo "" > diff.txt

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - name: Install SparkleForge
        run: uv sync

      - name: SparkleForge Diff Review
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'google' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'google/gemini-3.1-flash-lite-preview' }}
        run: uv run sparkleforge ci code-review --diff-file diff.txt

      - name: Leave PR review summary
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          HAS_PAT: ${{ secrets.PAT != '' }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::error::PAT repository secret is required so automation comments are authored by the PAT owner instead of github-actions[bot]."
            exit 1
          fi
          {
            echo "## SparkleForge review seed"
            echo
            cat review_result.txt
            echo
            echo "_This comment is used by the issue triage job to create follow-up work._"
          } > review-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body-file review-comment.md
            
      - name: Upload Review Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: review-results
          path: review_result.txt

  # 2단계: 리뷰 분석 및 작업 분할/이슈 생성 (SparkleForge 오케스트레이터 호출)
  issue-triage:
    needs: code-review
    if: >-
      always() &&
      needs.code-review.result == 'success' &&
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: write
      contents: read
      issues: write
    outputs:
      issue_url: ${{ steps.create_issue.outputs.issue_url }}
      issue_number: ${{ steps.create_issue.outputs.issue_number }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Review Artifact
        uses: actions/download-artifact@v4
        with:
          name: review-results

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - name: Install SparkleForge
        run: uv sync

      - name: SparkleForge Triage & Issue Create
        id: create_issue
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'google' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'google/gemini-3.1-flash-lite-preview' }}
          GH_TOKEN: ${{ secrets.PAT }}
          HAS_PAT: ${{ secrets.PAT != '' }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::error::PAT repository secret is required to create issues and dispatch opencode-auto-fix.yml as part of the automatic issue-to-PR flow."
            exit 1
          fi

          if [ ! -f review_result.txt ]; then
            echo "No review result found."
            exit 0
          fi
          
          gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --limit 100 \
            --json number,title > open_issues.json

          uv run sparkleforge ci issue-triage --review-file review_result.txt --open-issues-file open_issues.json

          if [ ! -f triage_result.json ]; then
            echo "Triage produced no result."
            exit 0
          fi
          
          SHOULD_CREATE=$(jq -r '.should_create_issue // false' triage_result.json)
          ISSUE_TITLE=$(jq -r '.title // empty' triage_result.json)
          ISSUE_BODY=$(jq -r '.body // empty' triage_result.json)
          
          if [ "$SHOULD_CREATE" != "true" ] || [ -z "$ISSUE_TITLE" ] || [ -z "$ISSUE_BODY" ]; then
            echo "Triage decided no actionable issue should be created."
            exit 0
          fi
          
          ISSUE_URL=$(gh issue create \
            --repo "${{ github.repository }}" \
            --title "$ISSUE_TITLE" \
            --body "$ISSUE_BODY" \
            --assignee "ppijbb")
          echo "Created issue: $ISSUE_URL"
          ISSUE_NUMBER="${ISSUE_URL##*/}"
          {
            echo "issue_url=$ISSUE_URL"
            echo "issue_number=$ISSUE_NUMBER"
          } >> "$GITHUB_OUTPUT"

          gh workflow run opencode-auto-fix.yml \
            --repo "${{ github.repository }}" \
            --field issue_number="$ISSUE_NUMBER" \
            --field max_iterations="3"

          echo "Created issue #$ISSUE_NUMBER and dispatched opencode-auto-fix.yml."

  merge-decision:
    needs: code-review
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.pull_request.base.ref == 'dev' ||
      github.event.pull_request.base.ref == 'main') &&
      github.event.pull_request.draft == false &&
      needs.code-review.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Review Artifact
        uses: actions/download-artifact@v4
        with:
          name: review-results

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - name: Install SparkleForge
        run: uv sync

      - name: Decide and merge PR
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'google' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'google/gemini-3.1-flash-lite-preview' }}
          GH_TOKEN: ${{ secrets.PAT }}
          HAS_PAT: ${{ secrets.PAT != '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::error::PAT repository secret is required to auto-merge reviewed PRs into dev."
            exit 1
          fi
          
          gh pr view "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --json title,body,url,isDraft,mergeStateStatus,reviewDecision,headRefName,baseRefName,statusCheckRollup > pr_meta.json

          uv run sparkleforge ci merge-decision --pr-meta-file pr_meta.json --review-file review_result.txt
          
          if [ ! -f merge_decision.json ]; then
            echo "Merge decider produced no result."
            exit 0
          fi
          
          SHOULD_MERGE=$(jq -r '.should_merge // false' merge_decision.json)
          REASON=$(jq -r '.reason // "No reason provided."' merge_decision.json)
          
          PR_TITLE=$(jq -r '.title // empty' pr_meta.json)
          MERGE_SUBJECT=$(python scripts/validate_commit_messages.py --normalize-title "$PR_TITLE")
          MERGE_STATE=$(jq -r '.mergeStateStatus // "UNKNOWN"' pr_meta.json)
          BASE_BRANCH=$(jq -r '.baseRefName // "UNKNOWN"' pr_meta.json)
          NOT_READY_CHECKS=$(jq -r '
            [.statusCheckRollup[]? |
              select(
                (.status != "COMPLETED") or
                (.conclusion != null and
                 .conclusion != "SUCCESS" and
                 .conclusion != "SKIPPED")
              )] | length
          ' pr_meta.json)

          {
            echo "## Auto Merge Decision"
            echo
            echo "**Decision:** $SHOULD_MERGE"
            echo
            echo "**Base branch:** $BASE_BRANCH"
            echo
            echo "**Merge state:** $MERGE_STATE"
            echo
            echo "**Reason:** $REASON"
          } > merge-decision-comment.md
          gh pr comment "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --body-file merge-decision-comment.md

          if [ "$SHOULD_MERGE" != "true" ]; then
            echo "Merge decision blocked auto-merge: $REASON"
            exit 0
          fi

          if [ "$MERGE_STATE" = "DIRTY" ] || [ "$MERGE_STATE" = "BLOCKED" ] || [ "$MERGE_STATE" = "DRAFT" ]; then
            echo "PR is not currently mergeable: $MERGE_STATE"
            exit 0
          fi

          if [ "$NOT_READY_CHECKS" != "0" ] || [ "$MERGE_STATE" != "CLEAN" ]; then
            echo "Checks are still settling or merge state is $MERGE_STATE; deferring to the scheduled auto-merge-ready-fix-prs job."
            exit 0
          fi

          gh pr merge "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --squash \
            --subject "$MERGE_SUBJECT" \
            --delete-branch

  auto-merge-ready-fix-prs:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Merge ready fix PRs
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          HAS_PAT: ${{ secrets.PAT != '' }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::error::PAT repository secret is required to auto-merge ready fix PRs."
            exit 1
          fi

          gh pr list \
            --repo "${{ github.repository }}" \
            --state open \
            --limit 100 \
            --json number,title,headRefName,baseRefName,isDraft,mergeable,mergeStateStatus,statusCheckRollup,body \
            --jq '.[] | select((.headRefName | startswith("fix/")) or (.headRefName | startswith("chore/"))) | @base64' |
          while read -r encoded; do
            [ -n "$encoded" ] || continue
            PR=$(echo "$encoded" | base64 -d)
            NUMBER=$(echo "$PR" | jq -r '.number')
            TITLE=$(echo "$PR" | jq -r '.title // empty')
            BASE_BRANCH=$(echo "$PR" | jq -r '.baseRefName')
            IS_DRAFT=$(echo "$PR" | jq -r '.isDraft')
            MERGEABLE=$(echo "$PR" | jq -r '.mergeable')
            MERGE_STATE=$(echo "$PR" | jq -r '.mergeStateStatus')
            MERGE_SUBJECT=$(python scripts/validate_commit_messages.py --normalize-title "$TITLE")

            if [ "$IS_DRAFT" = "true" ]; then
              echo "Skipping #$NUMBER: draft PR."
              continue
            fi
            if [ "$MERGEABLE" != "MERGEABLE" ] || [ "$MERGE_STATE" != "CLEAN" ]; then
              echo "Skipping #$NUMBER: mergeable=$MERGEABLE mergeState=$MERGE_STATE."
              continue
            fi

            NOT_READY=$(echo "$PR" | jq -r '
              [.statusCheckRollup[]? |
                select(
                  (.status != "COMPLETED") or
                  (.conclusion != null and
                   .conclusion != "SUCCESS" and
                   .conclusion != "SKIPPED")
                )] | length
            ')
            if [ "$NOT_READY" != "0" ]; then
              echo "Skipping #$NUMBER: checks are not all successful."
              continue
            fi

            echo "Merging #$NUMBER into $BASE_BRANCH."
            gh pr merge "$NUMBER" \
              --repo "${{ github.repository }}" \
              --squash \
              --subject "$MERGE_SUBJECT" \
              --delete-branch

            BODY=$(echo "$PR" | jq -r '.body // ""')
            ISSUES=$(echo "$BODY" | grep -Eio '(refs|close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' | grep -Eo '#[0-9]+' | tr -d '#' | sort -u || true)
            for ISSUE in $ISSUES; do
              gh issue edit "$ISSUE" \
                --repo "${{ github.repository }}" \
                --remove-label auto-fix-pr-opened || true
              gh label create auto-fix-merged \
                --repo "${{ github.repository }}" \
                --color 0E8A16 \
                --description "An automated fix PR has been merged." \
                --force >/dev/null 2>&1 || true
              gh issue edit "$ISSUE" \
                --repo "${{ github.repository }}" \
                --add-label auto-fix-merged || true
              gh issue comment "$ISSUE" \
                --repo "${{ github.repository }}" \
                --body "Fix PR #$NUMBER was merged into \`$BASE_BRANCH\`. This issue has been automatically closed."
              gh issue close "$ISSUE" \
                --repo "${{ github.repository }}" \
                --reason "completed" || true
            done
          done

  post-pr-merge-cleanup:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Cleanup linked issues on PR merge
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_BODY=$(gh pr view "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --json body \
            --jq '.body // ""')
          ISSUES=$(printf '%s\n' "$PR_BODY" |
            grep -Eio '(refs|close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' |
            grep -Eo '#[0-9]+' |
            tr -d '#' |
            sort -u || true)

          if [ -z "$ISSUES" ]; then
            echo "No linked issues found in PR #$PR_NUMBER body."
            exit 0
          fi

          for ISSUE in $ISSUES; do
            gh issue edit "$ISSUE" \
              --repo "${{ github.repository }}" \
              --remove-label auto-fix-pr-opened || true
            gh label create auto-fix-merged \
              --repo "${{ github.repository }}" \
              --color 0E8A16 \
              --description "An automated fix PR has been merged." \
              --force >/dev/null 2>&1 || true
            gh issue edit "$ISSUE" \
              --repo "${{ github.repository }}" \
              --add-label auto-fix-merged || true
            gh issue comment "$ISSUE" \
              --repo "${{ github.repository }}" \
              --body "Fix PR #$PR_NUMBER was merged. This issue has been automatically closed."
            gh issue close "$ISSUE" \
              --repo "${{ github.repository }}" \
              --reason "completed" || true
          done
