name: AI Autonomous Harness (Distributed)
on:
  push:
    branches:
      - 'chore/**'
      - main
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  issues:
    types: [opened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1단계: 코드 변경점 리뷰 (GitHub Copilot / Models - 무료)
  # 목적: 가벼운 리뷰, Diff 추출 (Gemini 토큰 낭비 방지)
  code-review:
    if: >-
      github.event_name == 'pull_request' || 
      github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Extract Git Diff
        run: git diff HEAD~1 HEAD > diff.txt || echo "" > diff.txt
        
      - name: Copilot / GitHub Models Review Placeholder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Copilot이나 GitHub Models API를 통해 diff.txt를 분석하고 리뷰 코멘트를 남깁니다."
          # 실제 구현 시: gh copilot CLI 또는 curl 호출
          
  # 2단계: 리뷰 분석 및 작업 분할/이슈 생성 (Groq / Cerebras / OpenRouter)
  # 목적: 텍스트 뭉치를 분석하여 액션 가능한 이슈 단위로 분할 (초고속/저비용 오픈 모델 사용)
  issue-triage:
    needs: code-review
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: LLM Router Triage (Groq/OpenRouter)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "오픈 모델(Groq 등)을 호출하여 코드 리뷰 결과를 바탕으로 GitHub Issue를 생성합니다."
          # 실제 구현 시: 파이썬 스크립트 등으로 API를 찌르고 `gh issue create` 실행

  # 3단계: 코드 수정 및 PR 반영 (Gemini CLI YOLO Mode)
  # 목적: 터미널 제어 및 실제 파일 수정 (강력한 추론과 툴링 필요 시에만 발동)
  gemini-harness:
    needs: issue-triage
    if: >-
      always() &&
      github.actor != 'github-actions[bot]' &&
      ((github.event_name == 'issues' && github.event.action == 'opened') ||
      contains(github.event.comment.body, '@gemini') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Run Gemini CLI Assistant (Tool Caller)
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Action 제어를 위한 권한 추가
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          model: gemini-3.1-flash-lite-preview
          system_instruction: |
            You are the SparkleForge Harness. 
            Refer to GEMINI.md in the repository root for your specific interaction rules and conventions.
            IMPORTANT: Do not read the entire codebase unless requested. Focus only on the specific issue or file mentioned.
            Use YOLO mode to edit files, commit changes, and push. You have GH_TOKEN in your env to run `gh` commands.
