name: AI Harness (Distributed)
on:
  push:
    branches:
      - main
      - 'chore/**'
      - 'ai-fix/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1단계: 코드 변경점 리뷰 (OpenRouter / Groq 등 무료 API 직접 호출)
  code-review:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Extract Git Diff
        run: git diff HEAD~1 HEAD > diff.txt || echo "" > diff.txt
        
      - name: OpenRouter Diff Review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "No OpenRouter key found, skipping."
            echo "Skipped" > review_result.txt
            exit 0
          fi
          
          # jq를 사용하여 안전하게 JSON 페이로드 생성 (따옴표 이스케이프 문제 방지)
          jq -n --arg diff "$(cat diff.txt)" '{
            model: "nvidia/nemotron-3-super-120b-a12b:free", 
            messages: [
              {role: "system", content: "You are an expert code reviewer. Read the git diff and summarize key issues, bugs, or style violations briefly."},
              {role: "user", content: $diff}
            ]
          }' > payload.json
          
          # curl을 통해 직접 API 찌르기
          curl -s -X POST "https://openrouter.ai/api/v1/chat/completions" \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d @payload.json | jq -r '.choices[0].message.content' > review_result.txt
            
      - name: Cerebras Diff Review
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          if [ -z "$CEREBRAS_API_KEY" ]; then
            echo "No Cerebras key found, skipping."
            echo "Skipped" > cerebras_result.txt
            exit 0
          fi
          
          jq -n --arg diff "$(cat diff.txt)" '{
            model: "zai-glm-4.7",
            messages: [
              {role: "system", content: "You are a security and architecture reviewer. Read this diff and point out critical logical or security flaws only."},
              {role: "user", content: $diff}
            ]
          }' > cerebras_payload.json
          
          curl -s -X POST "https://api.cerebras.ai/v1/chat/completions" \
            -H "Authorization: Bearer $CEREBRAS_API_KEY" \
            -H "Content-Type: application/json" \
            -d @cerebras_payload.json | jq -r '.choices[0].message.content' > cerebras_result.txt

      - name: Leave PR review summary
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## OpenCode review seed"
            echo
            echo "### OpenRouter"
            cat review_result.txt
            echo
            echo "### Cerebras"
            cat cerebras_result.txt
            echo
            echo "_This comment is used by the issue triage job to create follow-up work._"
          } > review-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body-file review-comment.md
            
      - name: Upload Review Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: review-results
          path: |
            review_result.txt
            cerebras_result.txt

  # 2단계: 리뷰 분석 및 작업 분할/이슈 생성 (Groq / Cerebras API 직접 호출)
  issue-triage:
    needs: code-review
    if: >-
      always() &&
      needs.code-review.result == 'success' &&
      (github.event_name == 'pull_request' || github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    outputs:
      issue_url: ${{ steps.create_issue.outputs.issue_url }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Review Artifact
        uses: actions/download-artifact@v4
        with:
          name: review-results
          
      - name: Groq API Triage & Issue Create
        id: create_issue
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f review_result.txt ] || [ -z "$GROQ_API_KEY" ]; then
            echo "No review result or Groq key found."
            exit 0
          fi
          
          # 두 리뷰를 하나로 합침
          COMBINED_REVIEW="OpenRouter Review:\n$(cat review_result.txt)\n\nCerebras Review:\n$(cat cerebras_result.txt 2>/dev/null || echo '')"
          
          # Groq 무료 티어 중 최고성능 모델을 통해 이슈 내용 생성
          jq -n --arg review "$COMBINED_REVIEW" \
            --arg system_msg "You are a senior developer talking to a teammate. Based on the review, generate a JSON object with 'title' and 'body' keys. The title should be a short, natural developer-style summary (e.g., 'Fix: Missing error handling in auth flow'), and the body should naturally explain what's wrong and how to fix it with code. No robotic headers. Just clear, peer-to-peer communication." \
            '{
              model: "openai/gpt-oss-120b",
              messages: [
                {role: "system", content: $system_msg},
                {role: "user", content: $review}
              ],
              response_format: { type: "json_object" }
            }' > groq_payload.json
          
          # 만들어진 텍스트에서 제목과 본문 추출 (마크다운 백틱 제거 로직 포함)
          RAW_RESPONSE=$(curl -s -X POST "https://api.groq.com/openai/v1/chat/completions" \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d @groq_payload.json)
          
          CONTENT=$(echo "$RAW_RESPONSE" | jq -r '.choices[0].message.content // empty')
          
          if [ -n "$CONTENT" ]; then
            # 마크다운 백틱(```json ... ```) 제거 후 순수 JSON만 추출
            CLEAN_JSON=$(echo "$CONTENT" | sed -n '/{/,/}/p')
            
            ISSUE_TITLE=$(echo "$CLEAN_JSON" | jq -r '.title // "Fix: Issue identified in review"')
            ISSUE_BODY=$(echo "$CLEAN_JSON" | jq -r '.body // empty')
            
            # 이슈 생성
            if [ -n "$ISSUE_TITLE" ] && [ "$ISSUE_TITLE" != "null" ]; then
              ISSUE_URL=$(gh issue create \
                --repo "${{ github.repository }}" \
                --title "$ISSUE_TITLE" \
                --body "$ISSUE_BODY")
              echo "Created issue: $ISSUE_URL"
              echo "issue_url=$ISSUE_URL" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Error: AI response content is empty."
            echo "Raw response: $RAW_RESPONSE"
          fi

  # 3단계: 코드 수정 및 PR 반영 (OpenCode low-cost worker)
  opencode-harness:
    needs: issue-triage
    if: >-
      always() &&
      github.actor != 'github-actions[bot]' &&
      ((github.event_name == 'push' && needs.issue-triage.outputs.issue_url != '') ||
      (github.event_name == 'issues' && github.event.action == 'opened') ||
      contains(github.event.comment.body, '@opencode') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install aiohttp

      - name: Resolve issue context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_URL="${{ needs.issue-triage.outputs.issue_url }}"
          if [ -z "$ISSUE_URL" ] && [ "${{ github.event_name }}" = "issues" ]; then
            ISSUE_URL="${{ github.event.issue.html_url }}"
          fi
          if [ -z "$ISSUE_URL" ]; then
            echo "No issue URL available for OpenCode worker."
            exit 0
          fi

          ISSUE_NUMBER="${ISSUE_URL##*/}"
          BRANCH="ai-fix/${ISSUE_NUMBER}-${{ github.run_id }}"
          git checkout -B "$BRANCH"
          gh issue view "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --json title,body,url \
            --jq '"# " + .title + "\n\n" + (.body // "") + "\n\n" + .url' > issue-context.md

          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "issue_url=$ISSUE_URL" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Generate and apply patch with OpenCode
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_PRIMARY: ${{ vars.OPENCODE_PRIMARY || 'openrouter' }}
          OPEN_CODE_MODEL_PATH: ${{ vars.OPEN_CODE_MODEL_PATH || 'minimax-m2.5-free' }}
        run: python scripts/opencode_github_worker.py fix-issue --issue-context issue-context.md

      - name: Commit, push, and open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "OpenCode produced no repository changes."
            exit 0
          fi

          git add -A ':!issue-context.md' ':!opencode.patch'
          git commit -m "fix: address issue #${{ steps.context.outputs.issue_number }} via OpenCode"
          git push --set-upstream origin "${{ steps.context.outputs.branch }}"

          gh label create ai-generated \
            --repo "${{ github.repository }}" \
            --description "Generated by AI automation" \
            --color 1d76db || true
          gh label create review-needed \
            --repo "${{ github.repository }}" \
            --description "Needs human review" \
            --color d93f0b || true

          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "${{ steps.context.outputs.branch }}" \
            --title "fix: address issue #${{ steps.context.outputs.issue_number }}" \
            --body "OpenCode-generated fix for ${{ steps.context.outputs.issue_url }}.

          Closes #${{ steps.context.outputs.issue_number }}

          Source run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label ai-generated \
            --label review-needed
