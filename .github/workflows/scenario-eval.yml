name: Scenario Eval (Anvil Ω-1)

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'main.py'
      - 'tests/benchmark/**'
      - '.github/workflows/scenario-eval.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'main.py'
      - 'tests/benchmark/**'
      - '.github/workflows/scenario-eval.yml'
  workflow_dispatch: {}

concurrency:
  group: scenario-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scenario-eval:
    name: Acceptance scenario scoring
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v5

      - name: Install SparkleForge
        run: uv sync

      - name: Run acceptance scenarios and compare against recorded history
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          set -e
          timeout 25m uv run python tests/benchmark/run_scenarios.py \
            --compare-to tests/benchmark/baselines/scenario_baseline.json \
            --compare-to-history tests/benchmark/baselines/scenario_history.jsonl \
            --json-out tests/benchmark/reports/scenario_report_ci.json
          SCENARIO_EXIT=$?
          if [ -f tests/benchmark/reports/scenario_report_ci.json ]; then
            python3 scripts/create_stagnation_issue.py \
              --report tests/benchmark/reports/scenario_report_ci.json \
              --history tests/benchmark/baselines/scenario_history.jsonl || true
          fi
          exit $SCENARIO_EXIT

      - name: Upload scenario report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-eval-report
          path: tests/benchmark/reports/scenario_report_ci.json
          if-no-files-found: ignore

  # Only on an actual merge to main (not every PR push) -- records this run's
  # score into the tracked history so overall_score/overall_score_adjusted
  # over time is directly readable (python tests/benchmark/run_scenarios.py
  # --print-trend tests/benchmark/baselines/scenario_history.jsonl) instead of
  # inferred from a single point-in-time pass/fail gate. Opens a chore/ branch
  # PR rather than pushing straight to main, so the existing
  # auto-merge-ready-fix-prs automation (gemini-assistant.yml) merges it once
  # checks pass -- reuses the already-proven merge path instead of new
  # direct-to-protected-branch push logic.
  record-history:
    name: Record scenario history
    needs: scenario-eval
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: scenario-eval-report
          path: tests/benchmark/reports/

      - name: Append report to history and open a PR
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          HAS_PAT: ${{ secrets.PAT != '' }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::PAT repository secret not set; skipping scenario history recording."
            exit 0
          fi
          if [ ! -f tests/benchmark/reports/scenario_report_ci.json ]; then
            echo "No scenario report artifact found for this commit; nothing to record."
            exit 0
          fi

          # Baseline validity gate: do not commit runs that reflect a total
          # model/infrastructure outage rather than agent capability. A run
          # where every scenario failed due to "No available models." (or where
          # the overall score is below 0.3) pollutes the benchmark dataset and
          # makes regression detection impossible. Override with
          # RECORD_INFRA_DIAGNOSTIC=1 for an explicit diagnostic run.
          python3 - <<'PY'
          import json
          import os
          import sys

          report = json.load(open('tests/benchmark/reports/scenario_report_ci.json'))
          overall = float(report.get('overall_score', 0.0) or 0.0)
          scenarios = report.get('scenarios', {}) or {}
          infra_failed = 0
          total = 0
          for scenario in scenarios.values():
              total += 1
              stdout = (scenario.get('stdout_excerpt') or '')
              if 'No available models.' in stdout or 'All fallback models failed' in stdout:
                  infra_failed += 1
          infra_ratio = (infra_failed / total) if total else 1.0
          is_infra_outage = overall < 0.3 or infra_ratio > 0.9
          if is_infra_outage and os.environ.get('RECORD_INFRA_DIAGNOSTIC') != '1':
              print(f"::warning::Skipping scenario history commit: overall_score={overall:.3f}, infra_failure_ratio={infra_ratio:.2f} indicates an infrastructure/model outage rather than agent capability. Set RECORD_INFRA_DIAGNOSTIC=1 to force-record this diagnostic run.")
              sys.exit(0)
          PY

          BRANCH="chore/scenario-history-${GITHUB_SHA::12}"
          git checkout -b "$BRANCH"
          # Strip verbose stderr_excerpt before appending to avoid unbounded
          # repository growth from fully-duplicated log blobs on every CI run.
          python3 - <<'PY'
          import json

          report = json.load(open('tests/benchmark/reports/scenario_report_ci.json'))
          scenarios = report.get('scenarios', {}) or {}
          for scenario in scenarios.values():
              scenario.pop('stderr_excerpt', None)
          with open('tests/benchmark/baselines/scenario_history.jsonl', 'a') as f:
              f.write(json.dumps(report, ensure_ascii=False) + '\n')
          PY

          # Mu-4: keep docs/BENCHMARK_REPORT.md's generated block in sync with
          # the history file it's sourced from, in the same commit/PR.
          python3 scripts/generate_benchmark_report.py

          git config user.name "sparkleforge-bot"
          git config user.email "actions@github.com"
          git add tests/benchmark/baselines/scenario_history.jsonl docs/BENCHMARK_REPORT.md
          git commit -m "chore: record scenario-eval history for ${GITHUB_SHA::12}"
          git push origin "$BRANCH"
          gh pr create --repo "${{ github.repository }}" \
            --title "chore: record scenario-eval history for ${GITHUB_SHA::12}" \
            --body "Appends this merge's scenario-eval report to tests/benchmark/baselines/scenario_history.jsonl. Auto-merges via the existing fix/chore auto-merge automation once checks pass." \
            --base main --head "$BRANCH"
