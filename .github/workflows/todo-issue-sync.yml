name: TODO Debt Issue Sync

# Turns Critical/High-priority TODO/FIXME code comments (sparkleforge ci collect-todos)
# into GitHub issues so they flow into the existing issue-driven auto-fix pipeline
# (opencode-auto-fix.yml / nightwelding.yml) instead of only living in a local
# docs/todo_inventory.md snapshot. Medium/Low items stay report-only to avoid
# flooding auto-fix with low-value or context-dependent comments.

on:
  schedule:
    - cron: '0 5 * * 1' # Monday 05:00 UTC (weekly; the backlog moves slowly)
  workflow_dispatch: {}

concurrency:
  group: todo-issue-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  sync-todo-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate automation PAT
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          HAS_PAT: ${{ secrets.PAT != '' }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::error::PAT repository secret is required so todo-debt issues are authored by the PAT owner instead of github-actions[bot] (the default token's issues don't trigger the opened-issue auto-fix workflows)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v5

      - name: Install SparkleForge
        run: uv sync

      - name: Ensure todo-debt label exists
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          gh label create "todo-debt" \
            --repo "${{ github.repository }}" \
            --color "5319E7" \
            --description "Auto-registered from a TODO/FIXME code comment scan" \
            2>/dev/null || true

      - name: Collect TODO/FIXME items
        run: uv run sparkleforge ci collect-todos

      - name: Fetch existing todo-debt issues
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          gh issue list --repo "${{ github.repository }}" --state all \
            --label "todo-debt" --limit 200 \
            --json number,body,state > existing-todo-issues.json

      - name: Plan new todo-debt issues
        run: |
          uv run sparkleforge ci plan-todo-issues \
            --inventory-file docs/todo_inventory.json \
            --existing-issues-file existing-todo-issues.json \
            --plan-out todo-issue-plan.json

      - name: Create planned todo-debt issues
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          COUNT=$(jq 'length' todo-issue-plan.json)
          for i in $(seq 0 $((COUNT - 1))); do
            [ "$COUNT" -eq 0 ] && break
            TITLE=$(jq -r ".[$i].title" todo-issue-plan.json)
            ANCHOR=$(jq -r ".[$i].anchor" todo-issue-plan.json)
            jq -r ".[$i].body" todo-issue-plan.json > issue-body.md

            if ! python scripts/validate_commit_messages.py --message "$TITLE"; then
              echo "::warning::Skipping $ANCHOR — generated title failed commit-message validation: $TITLE"
              continue
            fi

            gh issue create --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --body-file issue-body.md \
              --label "todo-debt"
            echo "Created issue for $ANCHOR"
          done
