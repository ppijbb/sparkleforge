name: SparkleForge Agent Metric Evaluation & Daily Report

on:
  schedule:
    # 18:00 KST every day -> 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

concurrency:
  group: agent-metric-report-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v5

      - name: Install SparkleForge
        run: |
          uv sync

      - name: Generate Daily Report
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          uv run python main.py report generate

      - name: Expose Report to Job Summary
        run: |
          REPORT_FILE=$(find results/agent_reports/ -name "report_*.md" | sort | tail -n 1)
          if [ -f "$REPORT_FILE" ]; then
            cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report file found" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit report changes and open a PR
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          HAS_PAT: ${{ secrets.PAT != '' }}
        run: |
          git config --global user.name "ppijbb"
          git config --global user.email "45420008+ppijbb@users.noreply.github.com"
          git add -f results/agent_reports/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::PAT repository secret not set; skipping report PR (main is a protected branch and cannot be pushed to directly)."
            exit 0
          fi

          BRANCH="chore/agent-report-$(date -u +%Y%m%d)"
          git checkout -b "$BRANCH"
          git commit -m "docs: auto-generate daily agent metric report and critique"
          git push origin "$BRANCH"
          gh pr create --repo "${{ github.repository }}" \
            --title "docs: auto-generate daily agent metric report and critique" \
            --body "Auto-generated daily agent metric report. Auto-merges via the existing fix/chore auto-merge automation once checks pass." \
            --base main --head "$BRANCH"
