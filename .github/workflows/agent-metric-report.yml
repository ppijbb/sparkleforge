name: SparkleForge Agent Metric Evaluation & Daily Report

on:
  schedule:
    # 18:00 KST every day -> 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

concurrency:
  group: agent-metric-report-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v5

      - name: Install SparkleForge
        run: |
          uv sync

      - name: Generate Daily Report
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'google' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'google/gemini-3.1-flash-lite-preview' }}
        run: |
          uv run python main.py report generate || EXIT=$?
          exit "${EXIT:-0}"

      - name: Expose Report to Job Summary
        run: |
          REPORT_FILE=$(find results/agent_reports/ -name "report_*.md" | sort | tail -n 1)
          if [ -f "$REPORT_FILE" ]; then
            cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report file found" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload agent report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-metric-report
          path: results/agent_reports/
          if-no-files-found: ignore

      - name: Commit report changes and open a PR
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          HAS_PAT: ${{ secrets.PAT != '' }}
        run: |
          git config --global user.name "ppijbb"
          git config --global user.email "45420008+ppijbb@users.noreply.github.com"
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::PAT repository secret not set; skipping report PR."
            exit 0
          fi
          echo "Agent reports are now published as workflow artifacts instead of committed to the repository."
          echo "Report artifacts uploaded; no repository commit required."
          exit 0

          # The steps below are retained for when report commits are re-enabled.
          BRANCH="chore/agent-report-$(date -u +%Y%m%d)"
          TITLE="chore: agent metric report $(date -u +%Y-%m-%d)"
          BODY="Auto-generated agent metric report. Auto-merge automation will merge this once checks pass."
          git checkout -B "$BRANCH"
          git add results/agent_reports/ || true
          if git diff --cached --quiet; then
            echo "No report changes to commit; skipping PR."
            exit 0
          fi
          git commit -m "$TITLE"
          git push --force-with-lease origin "$BRANCH"

          EXISTING_PR=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number,url \
            --jq '.[0] // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "Existing PR found for $BRANCH; skipping PR creation."
            exit 0
          fi

          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "$BODY" \
            --label "automerge"
