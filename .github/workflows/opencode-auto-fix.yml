name: OpenCode Auto Fix PR

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub issue number to fix with OpenCode'
        required: true
        type: string
  issues:
    types: [opened]
  issue_comment:
    types: [created]

concurrency:
  group: opencode-auto-fix-${{ github.event.issue.number || github.event.inputs.issue_number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  open-pr-and-fix:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@opencode')))
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      pr_url: ${{ steps.pr.outputs.pr_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install OpenCode worker dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install aiohttp

      - name: Resolve issue and branch
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ISSUE_NUMBER="${{ github.event.inputs.issue_number }}"
          else
            ISSUE_NUMBER="${{ github.event.issue.number }}"
          fi

          ISSUE_URL=$(gh issue view "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --json url \
            --jq '.url')
          BRANCH="ai-fix/$ISSUE_NUMBER-${{ github.run_id }}"

          git checkout -B "$BRANCH"
          gh issue view "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --json title,body,url \
            --jq '"# " + .title + "\n\n" + (.body // "") + "\n\n" + .url' > issue-context.md

          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "issue_url=$ISSUE_URL" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: OpenCode generate and apply patch
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_PRIMARY: ${{ vars.OPENCODE_PRIMARY || 'google' }}
          OPEN_CODE_MODEL_PATH: ${{ vars.OPEN_CODE_MODEL_PATH || 'minimax-m2.5-free' }}
        run: python scripts/opencode_github_worker.py fix-issue --issue-context issue-context.md

      - name: Commit and push OpenCode changes
        id: commit
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -A ':!issue-context.md' ':!opencode.patch'
          git commit -m "fix: address issue #${{ steps.context.outputs.issue_number }} via OpenCode"
          git push --set-upstream origin "${{ steps.context.outputs.branch }}"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Open or find pull request
        id: pr
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create ai-generated \
            --repo "${{ github.repository }}" \
            --description "Generated by AI automation" \
            --color 1d76db || true
          gh label create review-needed \
            --repo "${{ github.repository }}" \
            --description "Needs human review" \
            --color d93f0b || true

          EXISTING_PR=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "${{ steps.context.outputs.branch }}" \
            --base main \
            --state open \
            --json number,url \
            --jq '.[0] // empty')

          if [ -n "$EXISTING_PR" ]; then
            PR_NUMBER=$(echo "$EXISTING_PR" | jq -r '.number')
            PR_URL=$(echo "$EXISTING_PR" | jq -r '.url')
          else
            PR_URL=$(gh pr create \
              --repo "${{ github.repository }}" \
              --base main \
              --head "${{ steps.context.outputs.branch }}" \
              --title "fix: address issue #${{ steps.context.outputs.issue_number }}" \
              --body "OpenCode-generated fix for ${{ steps.context.outputs.issue_url }}.

          Closes #${{ steps.context.outputs.issue_number }}

          Source run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --label ai-generated \
              --label review-needed)
            PR_NUMBER=${PR_URL##*/}
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
