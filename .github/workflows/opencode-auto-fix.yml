name: OpenCode Auto Fix PR

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'External repository to fix (owner/name). Defaults to this repo.'
        required: false
        default: ''
        type: string
      issue_number:
        description: 'GitHub issue number to fix with OpenCode'
        required: false
        type: string
      max_iterations:
        description: 'Maximum OpenCode repair attempts before opening the PR'
        required: false
        default: '3'
        type: string
  issues:
    types: [opened, reopened, labeled]
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: >-
    opencode-auto-fix-${{
      github.event_name == 'issue_comment' &&
      !contains(github.event.comment.body, '@opencode') &&
      github.run_id ||
      github.event.issue.number ||
      github.event.inputs.issue_number ||
      github.run_id
    }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

env:
  AUTO_FIX_MERGE_METHOD: ${{ vars.AUTO_FIX_MERGE_METHOD || 'squash' }}
  AUTO_FIX_MERGE_WAIT_SECONDS: ${{ vars.AUTO_FIX_MERGE_WAIT_SECONDS || '900' }}

jobs:
  open-pr-and-fix:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'issues' &&
        (github.event.action == 'opened' ||
         github.event.action == 'reopened' ||
         github.event.label.name == 'auto-fix-requested' ||
         github.event.label.name == 'triage-needed')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      pr_url: ${{ steps.pr.outputs.pr_url }}
    steps:
      - name: Validate automation PAT
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          HAS_PAT: ${{ secrets.PAT != '' }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::error::PAT repository secret is required for automatic issue-to-PR flow. The default GITHUB_TOKEN is blocked from creating pull requests in this repository."
            echo "::error::Create a PAT secret with contents, issues, pull requests, and actions write access."
            exit 1
          fi
          gh auth status
          gh api "repos/${{ github.repository }}" --jq '.full_name'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Configure git identity
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          ACTOR_LOGIN=$(gh api user --jq '.login')
          ACTOR_ID=$(gh api user --jq '.id')
          git config user.name "$ACTOR_LOGIN"
          git config user.email "$ACTOR_ID+$ACTOR_LOGIN@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - name: Install SparkleForge (with dev/test dependencies)
        run: uv sync

      - name: Resolve issue and branch
        id: context
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          TARGET_REPO="${{ github.event.inputs.target_repo }}"
          if [ -z "$TARGET_REPO" ]; then
            TARGET_REPO="${{ github.repository }}"
          fi
          echo "target_repo=$TARGET_REPO" >> "$GITHUB_OUTPUT"
          if [ "$TARGET_REPO" != "${{ github.repository }}" ]; then
            echo "Cross-repo dogfooding target detected ($TARGET_REPO). Cloning external checkout."
            EXTERNAL_WORK_DIR="$RUNNER_TEMP/target-repo"
            rm -rf "$EXTERNAL_WORK_DIR"
            mkdir -p "$EXTERNAL_WORK_DIR"
            gh repo clone "$TARGET_REPO" "$EXTERNAL_WORK_DIR" -- --depth=1 --no-tags
            echo "target_path=$EXTERNAL_WORK_DIR" >> "$GITHUB_OUTPUT"
          else
            echo "target_path=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.issue_number }}" ]; then
            ISSUE_NUMBER="${{ github.event.inputs.issue_number }}"
          elif [ "${{ github.event_name }}" = "issues" ] || [ "${{ github.event_name }}" = "issue_comment" ]; then
            ISSUE_NUMBER="${{ github.event.issue.number }}"
          else
            gh issue list \
              --repo "${{ github.repository }}" \
              --state open \
              --limit 1000 \
              --json number,labels > open-issue-candidates.json
            gh pr list \
              --repo "${{ github.repository }}" \
              --state open \
              --limit 1000 \
              --json number,headRefName,body \
              > open-pr-candidates.json
            uv run sparkleforge ci select-issue \
              --issues-file open-issue-candidates.json \
              --open-prs-file open-pr-candidates.json
            ISSUE_NUMBER=$(cat selected_issue.txt)
          fi

          if [ -z "$ISSUE_NUMBER" ]; then
            echo "No eligible open issue was found. Open issues with auto-fix-pr-opened, auto-fix-merged, auto-fix-failed, or an already-linked open fix PR are skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Written immediately so a later failure in this step (e.g. commit-title
          # derivation/validation) still lets the "Report auto-fix failure on issue"
          # step label and comment on the issue. Without this, a failure here leaves
          # steps.context.outputs.issue_number empty, the issue never gets
          # auto-fix-failed, and the same issue is re-selected and re-fails on every
          # subsequent scheduled run forever, blocking every other open issue.
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

          ISSUE_URL=$(gh issue view "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --json url \
            --jq '.url')
          ISSUE_TITLE=$(gh issue view "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --json title \
            --jq '.title')
          uv run sparkleforge ci classify-commit --title "$ISSUE_TITLE"
          CONVENTIONAL_TYPE=$(jq -r '.type' commit_classification.json)
          SUBJECT=$(jq -r '.subject' commit_classification.json)
          if [ -z "$SUBJECT" ]; then
            echo "::error::Unable to derive a specific commit subject from issue #$ISSUE_NUMBER."
            exit 1
          fi
          PR_TITLE=$(printf '%s: %s' "$CONVENTIONAL_TYPE" "$SUBJECT" | sed 's/"/\\"/g')
          COMMIT_TITLE="$PR_TITLE"
          if ! printf '%s' "$COMMIT_TITLE" | grep -Eq '^(feat|fix|refactor|chore|docs|test|perf|ci|build|style)(\(.+\))?!?: .+'; then
            echo "::error::Normalized commit title does not match Conventional Commits format: '$COMMIT_TITLE'"
            exit 1
          fi
          python scripts/validate_commit_messages.py --message "$COMMIT_TITLE"
          BASE_BRANCH="${{ vars.AUTO_FIX_BASE_BRANCH }}"
          if [ -z "$BASE_BRANCH" ]; then
            BASE_BRANCH=$(gh repo view "${{ github.repository }}" \
              --json defaultBranchRef \
              --jq '.defaultBranchRef.name')
          fi
          BRANCH="fix/$ISSUE_NUMBER-${{ github.run_id }}"

          git fetch origin "$BASE_BRANCH" --depth=1
          git checkout -B "$BRANCH" "origin/$BASE_BRANCH"
          gh issue view "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --json title,body,url,comments \
            --jq '
              "# " + .title +
              "\n\n" + (.body // "") +
              "\n\n" + .url +
              "\n\n## Recent issue comments\n\n" +
              ([
                (.comments // [])[-8:][]? |
                "### " + .author.login + " at " + .createdAt + "\n" + (.body // "")
              ] | join("\n\n"))
            ' > issue-context.md

          {
            echo "issue_url=$ISSUE_URL"
            echo "pr_title<<EOF"
            echo "$PR_TITLE"
            echo "EOF"
            echo "commit_title=$COMMIT_TITLE"
            echo "base_branch=$BASE_BRANCH"
            echo "branch=$BRANCH"
          } >> "$GITHUB_OUTPUT"

      - name: Clear explicit retry labels
        if: >-
          steps.context.outputs.skip != 'true' &&
          (github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@opencode')) ||
          (github.event_name == 'issues' && github.event.label.name == 'auto-fix-requested'))
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          gh issue edit "${{ steps.context.outputs.issue_number }}" \
            --repo "${{ github.repository }}" \
            --remove-label auto-fix-failed,auto-fix-pr-opened,auto-fix-requested 2>/dev/null || true

      - name: OpenCode repair loop
        if: steps.context.outputs.skip != 'true'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_PRIMARY: ${{ vars.OPENCODE_PRIMARY || 'google' }}
          OPEN_CODE_MODEL_PATH: ${{ vars.OPEN_CODE_MODEL_PATH || 'minimax/minimax-m2.5:free' }}
        run: |
          uv run sparkleforge autofix run \
            --issue-context issue-context.md \
            --commit-title "${{ steps.context.outputs.commit_title }}" \
            --max-iterations "${{ github.event.inputs.max_iterations || '3' }}" \
            --verify-command "${{ vars.OPENCODE_VERIFY_COMMAND || 'python -m compileall -q src scripts' }}" \
            --self-verify-command "${{ vars.OPENCODE_SELF_VERIFY_COMMAND || 'python scripts/check_test_code.py' }}"

      - name: Push OpenCode changes
        id: commit
        if: steps.context.outputs.skip != 'true'
        run: |
          if ! git rev-parse --verify HEAD >/dev/null 2>&1 ||
             [ -z "$(git log --oneline origin/${{ steps.context.outputs.base_branch }}..HEAD)" ]; then
            echo "::error::OpenCode completed without commits for issue #${{ steps.context.outputs.issue_number }}."
            exit 1
          fi

          git push --set-upstream origin "${{ steps.context.outputs.branch }}"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Open or find pull request
        id: pr
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          ISSUE_NUMBER="${{ steps.context.outputs.issue_number }}"
          BASE_BRANCH="${{ steps.context.outputs.base_branch }}"

          # Guard against auto-closing issues that OpenCode didn't actually
          # finish: assesses two complementary signals (issue #511's
          # checklist/file-type/line-count heuristic, and issue #521's
          # issue-symbol/diff-overlap check -- catches stub diffs that touch
          # real .py files with a handful of lines but implement none of the
          # symbols the issue names) and combines them into one verdict.
          uv run sparkleforge ci assess-substantiality \
            --issue-file issue-context.md \
            --range "origin/$BASE_BRANCH...HEAD"
          SUBSTANTIAL=$(jq -r '.substantial' substantiality_result.json)
          SCOPE_REASON=$(jq -r '.reason' substantiality_result.json)
          UNCHECKED=$(jq -r '.unchecked' substantiality_result.json)

          if [ "$SUBSTANTIAL" = "true" ]; then
            CLOSES_LINE="Closes #$ISSUE_NUMBER"
          else
            CLOSES_LINE="Refs #$ISSUE_NUMBER (not auto-closed: diff only touches workflow/docs files and the issue still has $UNCHECKED unresolved checklist item(s)${SCOPE_REASON} — needs a real follow-up implementation)"
          fi

          EXISTING_PR=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "${{ steps.context.outputs.branch }}" \
            --base "${{ steps.context.outputs.base_branch }}" \
            --state open \
            --json number,url \
            --jq '.[0] // empty')

          if [ -n "$EXISTING_PR" ]; then
            PR_NUMBER=$(echo "$EXISTING_PR" | jq -r '.number')
            PR_URL=$(echo "$EXISTING_PR" | jq -r '.url')
          else
            PR_URL=$(gh pr create \
              --repo "${{ github.repository }}" \
              --base "${{ steps.context.outputs.base_branch }}" \
              --head "${{ steps.context.outputs.branch }}" \
              --title "${{ steps.context.outputs.pr_title }}" \
              --body "OpenCode-generated fix for ${{ steps.context.outputs.issue_url }}.

          $CLOSES_LINE

          Source run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
            PR_NUMBER=${PR_URL##*/}
          fi

          {
            echo "pr_number=$PR_NUMBER"
            echo "pr_url=$PR_URL"
            echo "closes_line=$CLOSES_LINE"
            echo "substantial=$SUBSTANTIAL"
          } >> "$GITHUB_OUTPUT"

          gh issue comment "${{ steps.context.outputs.issue_number }}" \
            --repo "${{ github.repository }}" \
            --body "OpenCode auto-fix PR: $PR_URL"
          gh label create auto-fix-pr-opened \
            --repo "${{ github.repository }}" \
            --color 0E8A16 \
            --description "An automated fix PR has been opened for this issue." \
            --force >/dev/null 2>&1 || true
          gh issue edit "${{ steps.context.outputs.issue_number }}" \
            --repo "${{ github.repository }}" \
            --add-label auto-fix-pr-opened || true

          if [ "$SUBSTANTIAL" != "true" ]; then
            gh label create needs-follow-up \
              --repo "${{ github.repository }}" \
              --color FBCA04 \
              --description "Automated fix only made a trivial/workflow change; issue checklist is still unresolved." \
              --force >/dev/null 2>&1 || true
            gh issue edit "${{ steps.context.outputs.issue_number }}" \
              --repo "${{ github.repository }}" \
              --add-label needs-follow-up || true
            gh issue comment "${{ steps.context.outputs.issue_number }}" \
              --repo "${{ github.repository }}" \
              --body "⚠️ PR $PR_URL only touches workflow/docs files and this issue still has $UNCHECKED unresolved checklist item(s), so it will **not** auto-close this issue on merge. A real implementation is still needed." || true
          fi

      - name: Wait for pull request checks
        if: steps.pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          WAIT_SECONDS="$AUTO_FIX_MERGE_WAIT_SECONDS"
          case "$WAIT_SECONDS" in
            ''|*[!0-9]*) WAIT_SECONDS=900 ;;
          esac

          echo "Waiting up to ${WAIT_SECONDS}s for PR #${{ steps.pr.outputs.pr_number }} checks."
          DEADLINE=$((SECONDS + WAIT_SECONDS))
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            set +e
            gh pr checks "${{ steps.pr.outputs.pr_number }}" \
              --repo "${{ github.repository }}" \
              --watch \
              --interval 15 \
              --fail-fast
            RC=$?
            set -e

            if [ "$RC" -eq 0 ]; then
              exit 0
            fi

            CHECK_COUNT=$(gh pr view "${{ steps.pr.outputs.pr_number }}" \
              --repo "${{ github.repository }}" \
              --json statusCheckRollup \
              --jq '.statusCheckRollup | length')
            if [ "$CHECK_COUNT" != "0" ]; then
              exit "$RC"
            fi

            echo "No checks reported yet for PR #${{ steps.pr.outputs.pr_number }}; waiting for GitHub to attach checks."
            sleep 15
          done

          echo "::error::Timed out waiting for checks to appear on PR #${{ steps.pr.outputs.pr_number }}."
          exit 1

      - name: Skip merge for non-substantial fix
        if: steps.pr.outputs.pr_number != '' && steps.pr.outputs.substantial != 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          echo "::warning::PR ${{ steps.pr.outputs.pr_url }} only touches workflow/docs files while issue #${{ steps.context.outputs.issue_number }} still has unresolved checklist items. Leaving it open for human review instead of auto-merging."
          gh pr comment "${{ steps.pr.outputs.pr_number }}" \
            --repo "${{ github.repository }}" \
            --body "🛑 Not auto-merging: this change only touches workflow/docs files and issue #${{ steps.context.outputs.issue_number }} still has unresolved checklist items. A human should confirm this is a real fix (or close as won't-fix) before merging." || true

      - name: Merge pull request
        id: merge
        if: steps.pr.outputs.pr_number != '' && steps.pr.outputs.substantial == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          case "$AUTO_FIX_MERGE_METHOD" in
            merge|squash|rebase) ;;
            *)
              echo "::error::AUTO_FIX_MERGE_METHOD must be one of: merge, squash, rebase."
              exit 1
              ;;
          esac

          gh pr merge "${{ steps.pr.outputs.pr_number }}" \
            --repo "${{ github.repository }}" \
            --"$AUTO_FIX_MERGE_METHOD" \
            --subject "$(echo "${{ steps.context.outputs.pr_title }}" | sed 's/"/\\"/g')" \
            --body "${{ steps.pr.outputs.closes_line }}" \
            --delete-branch || true

          gh issue edit "${{ steps.context.outputs.issue_number }}" \
            --repo "${{ github.repository }}" \
            --remove-label auto-fix-pr-opened || true
          gh label create auto-fix-merged \
            --repo "${{ github.repository }}" \
            --color 0E8A16 \
            --description "An automated fix PR has been merged." \
            --force >/dev/null 2>&1 || true
          gh issue edit "${{ steps.context.outputs.issue_number }}" \
            --repo "${{ github.repository }}" \
            --add-label auto-fix-merged || true
          gh issue comment "${{ steps.context.outputs.issue_number }}" \
            --repo "${{ github.repository }}" \
            --body "OpenCode auto-fix PR merged: ${{ steps.pr.outputs.pr_url }}. This issue has been automatically closed."
          gh issue close "${{ steps.context.outputs.issue_number }}" \
            --repo "${{ github.repository }}" \
            --reason "completed" || true

      - name: Report auto-fix failure on issue
        if: failure() && steps.context.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          gh label create auto-fix-failed \
            --repo "${{ github.repository }}" \
            --color B60205 \
            --description "Automated OpenCode fix failed before PR creation." \
            --force >/dev/null 2>&1 || true
          gh issue edit "${{ steps.context.outputs.issue_number }}" \
            --repo "${{ github.repository }}" \
            --remove-label auto-fix-pr-opened \
            --add-label auto-fix-failed || true
          {
            echo "OpenCode auto-fix failed before a PR could be created."
            echo
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Workflow: ${{ github.workflow }}"
            echo "- Issue: #${{ steps.context.outputs.issue_number }}"
            echo
            if [ -f opencode-worker-error.log ]; then
              echo "Worker error:"
              echo '```text'
              tail -n 120 opencode-worker-error.log
              echo '```'
            fi
            if [ -f opencode-verify.log ]; then
              echo
              echo "Verification output:"
              echo '```text'
              tail -n 120 opencode-verify.log
              echo '```'
            fi
          } > auto-fix-failure-comment.md
          gh issue comment "${{ steps.context.outputs.issue_number }}" \
            --repo "${{ github.repository }}" \
            --body-file auto-fix-failure-comment.md
