name: Auto Fix Harness
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opencode-harness:
    if: >-
      (github.event_name == 'issues' && github.event.action == 'opened') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@opencode')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install aiohttp

      - name: Resolve issue context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_URL=""
          if [ "${{ github.event_name }}" = "issues" ]; then
            ISSUE_URL="${{ github.event.issue.html_url }}"
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            ISSUE_URL="${{ github.event.issue.html_url }}"
          fi
          
          if [ -z "$ISSUE_URL" ]; then
            echo "No issue URL available for OpenCode worker."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ISSUE_NUMBER="${ISSUE_URL##*/}"
          BRANCH="fix/${ISSUE_NUMBER}-${{ github.run_id }}"
          git checkout -B "$BRANCH"
          
          # Fetch issue details
          gh issue view "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --json title,body,url \
            --jq '"# " + .title + "\n\n" + (.body // "") + "\n\n" + .url' > issue-context.md

          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "issue_url=$ISSUE_URL" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Generate and apply patch with OpenCode
        if: steps.context.outputs.skip != 'true'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_PRIMARY: ${{ vars.OPENCODE_PRIMARY || 'openrouter' }}
          OPEN_CODE_MODEL_PATH: ${{ vars.OPEN_CODE_MODEL_PATH || 'minimax/minimax-m2.5:free' }}
        run: python scripts/opencode_github_worker.py fix-issue --issue-context issue-context.md

      - name: Commit, push, and open PR
        if: steps.context.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "OpenCode produced no repository changes."
            exit 0
          fi

          git add -A ':!issue-context.md' ':!opencode.patch'
          git commit -m "fix: address issue #${{ steps.context.outputs.issue_number }} via OpenCode"
          git push --set-upstream origin "${{ steps.context.outputs.branch }}"

          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "${{ steps.context.outputs.branch }}" \
            --title "fix: address issue #${{ steps.context.outputs.issue_number }}" \
            --body "OpenCode-generated fix for ${{ steps.context.outputs.issue_url }}.

          Closes #${{ steps.context.outputs.issue_number }}

          Source run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
