name: Auto Fix Harness

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub issue number to fix with OpenCode'
        required: true
        type: string
      max_iterations:
        description: 'Maximum OpenCode repair attempts before opening the PR'
        required: false
        default: '3'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  dispatch-opencode-auto-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Validate automation PAT
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          HAS_PAT: ${{ secrets.PAT != '' }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::error::PAT repository secret is required to dispatch opencode-auto-fix.yml."
            exit 1
          fi
          gh auth status

      - name: Validate issue number
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          ISSUE_NUMBER="${{ github.event.inputs.issue_number }}"
          if [ -z "$ISSUE_NUMBER" ] || ! [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid issue_number: '$ISSUE_NUMBER'. Must be a non-empty numeric string."
            exit 1
          fi
          if ! gh issue view "$ISSUE_NUMBER" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Issue #$ISSUE_NUMBER does not exist in ${{ github.repository }}."
            exit 1
          fi

      - name: Dispatch OpenCode Auto Fix PR workflow
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          gh workflow run opencode-auto-fix.yml \
            --repo "${{ github.repository }}" \
            --field issue_number="${{ github.event.inputs.issue_number }}" \
            --field max_iterations="${{ github.event.inputs.max_iterations }}"
