name: SparkleForge Daily Roadmap Issue

on:
  schedule:
    # 00:30 Asia/Seoul every day.
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      max_iterations:
        description: 'Maximum OpenCode repair attempts after the issue is created'
        required: false
        default: '3'
        type: string

concurrency:
  group: sparkleforge-daily-roadmap-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-roadmap-issue:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    outputs:
      issue_number: ${{ steps.create_issue.outputs.issue_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v5

      - name: Install SparkleForge
        run: |
          uv sync

      - name: Ensure daily-roadmap-reliability label exists
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          gh label create "daily-roadmap-reliability" \
            --repo "${{ github.repository }}" \
            --color "B60205" \
            --description "Recurring daily-roadmap generation failures tracked as one issue instead of one per day" \
            2>/dev/null || true

      - name: Prepare daily research prompt
        id: prompt
        run: |
          TODAY="$(TZ=Asia/Seoul date +%Y-%m-%d)"
          uv run sparkleforge report daily-roadmap-prompt --today "$TODAY" > daily-roadmap-prompt.md
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"

      - name: Collect GitHub planning context
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          TODAY: ${{ steps.prompt.outputs.today }}
        run: |
          {
            echo "## Current GitHub issue and PR context"
            echo
            echo "Use this repository context as the primary input for the daily roadmap. Prioritize unblocked, high-leverage work from these issues and PRs before proposing net-new ideas."
            echo
            echo "### Open pull requests"
          } > github-planning-context.md

          gh pr list \
            --repo "${{ github.repository }}" \
            --state open \
            --limit 40 \
            --json number,title,headRefName,baseRefName,isDraft,mergeStateStatus,updatedAt,labels \
            --jq '.[] | "- #\(.number) \(.title) [\(.headRefName) -> \(.baseRefName); draft=\(.isDraft); merge=\(.mergeStateStatus); updated=\(.updatedAt); labels=\([.labels[].name] | join(", "))]"' \
            > open-prs.md
          if [ ! -s open-prs.md ]; then
            echo "- No open pull requests." > open-prs.md
          fi
          cat open-prs.md >> github-planning-context.md

          {
            echo
            echo "### Open issues"
          } >> github-planning-context.md

          gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --limit 80 \
            --json number,title,updatedAt,labels,assignees \
            --jq '.[] | "- #\(.number) \(.title) [updated=\(.updatedAt); labels=\([.labels[].name] | join(", ")); assignees=\([.assignees[].login] | join(", "))]"' \
            > open-issues.md
          if [ ! -s open-issues.md ]; then
            echo "- No open issues." > open-issues.md
          fi
          cat open-issues.md >> github-planning-context.md

          {
            echo
            echo "### Anvil roadmap status"
          } >> github-planning-context.md

          gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --search "Milestone: in:title label:sparkleforge-roadmap sort:created-desc" \
            --json number,title,body \
            --jq '.[0] // empty' \
            > anvil-milestone.json

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          raw = Path("anvil-milestone.json").read_text(encoding="utf-8").strip()
          milestone = json.loads(raw) if raw else None

          numbers = []
          if milestone:
              numbers = sorted(set(int(n) for n in re.findall(r"[—-]\s*#(\d+)", milestone.get("body", ""))))

          text = "\n".join(str(n) for n in numbers)
          Path("anvil-subissue-numbers.txt").write_text(text + "\n" if text else "", encoding="utf-8")
          PY

          : > anvil-subissue-status.json
          if [ -s anvil-subissue-numbers.txt ]; then
            while IFS= read -r NUM || [ -n "$NUM" ]; do
              [ -z "$NUM" ] && continue
              ISSUE_JSON=$(gh issue view "$NUM" --repo "${{ github.repository }}" --json number,title,state 2>/dev/null || echo "")
              if [ -n "$ISSUE_JSON" ] && printf '%s' "$ISSUE_JSON" | jq -e . >/dev/null 2>&1; then
                printf '%s\n' "$ISSUE_JSON" >> anvil-subissue-status.json
              fi
            done < anvil-subissue-numbers.txt
          fi
          jq -s '.' anvil-subissue-status.json > anvil-subissue-status.json.tmp \
            && mv anvil-subissue-status.json.tmp anvil-subissue-status.json \
            || echo '[]' > anvil-subissue-status.json
          jq empty anvil-subissue-status.json

          python - <<'PY' >> github-planning-context.md
          import json
          from pathlib import Path

          raw = Path("anvil-milestone.json").read_text(encoding="utf-8").strip()
          milestone = json.loads(raw) if raw else None

          if not milestone:
              print("- No open Anvil phase milestone found.")
          else:
              sub_status = json.loads(Path("anvil-subissue-status.json").read_text(encoding="utf-8") or "[]")
              print(f"- Open milestone: #{milestone['number']} {milestone['title']}")
              if sub_status:
                  for item in sub_status:
                      print(f"  - #{item['number']} [{item['state']}] {item['title']}")
              else:
                  print("- No sub-issues referenced in the milestone checklist yet.")

              open_target = next((item for item in sub_status if item["state"] == "OPEN"), None)
              if open_target:
                  print(f"- Next open Anvil roadmap sub-issue: #{open_target['number']} {open_target['title']}")
                  Path("anvil-roadmap-target.md").write_text(f"{open_target['number']}|{open_target['title']}", encoding="utf-8")
              else:
                  print("- All known Anvil roadmap sub-issues are closed (or none tracked).")
                  Path("anvil-roadmap-target.md").write_text("", encoding="utf-8")
          PY

          if [ ! -f anvil-roadmap-target.md ]; then
            : > anvil-roadmap-target.md
          fi

          {
            echo
            echo "### Anvil roadmap document (docs/ANVIL_PLAN.md)"
            echo '```markdown'
            cat docs/ANVIL_PLAN.md
            echo '```'
          } >> github-planning-context.md

          {
            echo
            echo "### Daily selection rule"
            echo "- If '### Anvil roadmap status' lists a next open Anvil roadmap sub-issue, that is the required target for today: implement its concrete checklist items, don't propose something else instead."
            echo "- Only if no Anvil roadmap sub-issue is open: if a PR is open and blocked by a workflow or review failure, prefer a roadmap item that unblocks it."
            echo "- Only if neither of the above applies: propose a new item, but justify it against docs/ANVIL_PLAN.md section 4 so it extends the existing phase structure instead of ignoring it."
            echo "- If repeated daily-roadmap failure issues are open, prefer a roadmap item that restores daily roadmap generation/update reliability."
            echo "- Do not create a generic trend-only item when a concrete open issue, PR, or Anvil roadmap sub-issue is more actionable."
          } >> github-planning-context.md

          {
            echo
            cat github-planning-context.md
          } >> daily-roadmap-prompt.md

      - name: Run SparkleForge research
        id: research
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SPARKLEFORGE_CLI_INTERACTIVE: 'false'
          MCP_BUILDER_ENABLED: 'false'
          MCP_ALLOWED_SERVERS: 'local-search,search,web-fetch,arxiv,sparkleforge-skills'
          SPARKLEFORGE_ALLOWED_MCP_SERVERS: 'local-search,search,web-fetch,arxiv,sparkleforge-skills'
          SPARKLEFORGE_SKIP_ERA_FOR_MCP: 'true'
          SPARKLEFORGE_ENV: ${{ vars.SPARKLEFORGE_ENV || 'production' }}
        run: |
          set +e
          timeout 10m uv run python -m src.cli.entry run --max-tokens 4096 --model google/gemini-2.0-flash-exp \
            --output sparkleforge-roadmap.md --task "SparkleForge Daily Roadmap" \
            --format markdown \
            < daily-roadmap-prompt.md > sparkleforge-roadmap-console.log \
            2> sparkleforge-roadmap-error.log
          RC=$?
          set -e

          OUTPUT_BYTES=$(wc -c < sparkleforge-roadmap.md 2>/dev/null || echo 0)
          CONSOLE_BYTES=$(wc -c < sparkleforge-roadmap-console.log 2>/dev/null || echo 0)
          ERROR_BYTES=$(wc -c < sparkleforge-roadmap-error.log 2>/dev/null || echo 0)
          INVALID_OUTPUT_REASON=""

          if [ -s sparkleforge-roadmap.md ]; then
            if grep -Fq "Generated roadmap based on:" sparkleforge-roadmap.md; then
              INVALID_OUTPUT_REASON="CLI produced placeholder roadmap text instead of a real SparkleForge analysis"
            elif grep -Fq "SparkleForge failed while generating the daily improvement roadmap." sparkleforge-roadmap.md; then
              INVALID_OUTPUT_REASON="CLI output was already a failure report"
            else
              for section in "## Why now" "## Proposed change" "## Implementation notes" "## Acceptance criteria" "## Validation"; do
                if ! grep -Fq "$section" sparkleforge-roadmap.md; then
                  INVALID_OUTPUT_REASON="CLI output is missing required section: $section"
                  break
                fi
              done
            fi
          fi

          if [ "$RC" -ne 0 ] || [ ! -s sparkleforge-roadmap.md ] || [ -n "$INVALID_OUTPUT_REASON" ]; then
            export DAILY_RC="$RC"
            export DAILY_OUTPUT_BYTES="$OUTPUT_BYTES"
            export DAILY_CONSOLE_BYTES="$CONSOLE_BYTES"
            export DAILY_ERROR_BYTES="$ERROR_BYTES"
            export DAILY_INVALID_OUTPUT_REASON="$INVALID_OUTPUT_REASON"
            python - <<'PY' > sparkleforge-roadmap.md
          import os
          import re
          from pathlib import Path

          context = Path("github-planning-context.md").read_text(encoding="utf-8")

          def collect(header: str, stop: str) -> list[str]:
              active = False
              rows = []
              for raw in context.splitlines():
                  line = raw.strip()
                  if line == header:
                      active = True
                      continue
                  if active and line == stop:
                      break
                  if active and line.startswith("- #"):
                      rows.append(line)
              return rows

          anvil_target_path = Path("anvil-roadmap-target.md")
          anvil_target = anvil_target_path.read_text(encoding="utf-8").strip() if anvil_target_path.exists() else ""

          prs = collect("### Open pull requests", "### Open issues")
          issues = collect("### Open issues", "### Anvil roadmap status")

          if anvil_target:
              number, _, title = anvil_target.partition("|")
              target_kind = "anvil roadmap sub-issue"
          elif prs:
              target_kind = "pull request"
              match = re.match(r"- #(?P<number>\d+) (?P<title>.*?) \[", prs[0])
              number = match.group("number") if match else ""
              title = match.group("title") if match else "repository backlog"
          elif issues:
              target_kind = "issue"
              match = re.match(r"- #(?P<number>\d+) (?P<title>.*?) \[", issues[0])
              number = match.group("number") if match else ""
              title = match.group("title") if match else "repository backlog"
          else:
              target_kind = "repository backlog"
              number = ""
              title = "repository backlog"

          if target_kind == "anvil roadmap sub-issue" and number:
              heading = f"Advance Anvil roadmap sub-issue {number}"
              target_label = f"Anvil roadmap sub-issue #{number}: {title}"
          elif target_kind == "pull request" and number:
              heading = f"Unblock pull request {number}"
              target_label = f"PR #{number}: {title}"
          elif target_kind == "issue" and number:
              heading = f"Triage issue {number}"
              target_label = f"Issue #{number}: {title}"
          else:
              heading = "Triage issue 13"
              target_label = title

          rc = os.getenv("DAILY_RC", "")
          invalid = os.getenv("DAILY_INVALID_OUTPUT_REASON", "")
          output_bytes = os.getenv("DAILY_OUTPUT_BYTES", "0")
          console_bytes = os.getenv("DAILY_CONSOLE_BYTES", "0")
          error_bytes = os.getenv("DAILY_ERROR_BYTES", "0")

          print(f"# {heading}")
          print()
          print("## Why now")
          print("- Daily roadmap generation must update the tracked GitHub issue even when the full SparkleForge research path is slow, unavailable, or returns invalid output.")
          print(f"- The live GitHub context collection selected {target_label} as the top actionable backlog item.")
          print(f"- SparkleForge CLI fallback metadata: exit code `{rc}`, output bytes `{output_bytes}`, console bytes `{console_bytes}`, error bytes `{error_bytes}`.")
          if invalid:
              print(f"- Invalid output reason: {invalid}.")
          print()
          print("## Proposed change")
          print(f"- Use the current repository issue/PR context to move {target_label} toward a mergeable or closable state.")
          print("- Keep the scope bounded to the smallest code, workflow, or documentation change needed to unblock that item.")
          print()
          print("## Implementation notes")
          if target_kind == "anvil roadmap sub-issue":
              print(f"- This is an Anvil roadmap sub-issue (#{number}). Implement exactly the checklist items in that issue's body — do not re-scope it or substitute a different idea.")
              print("- See docs/ANVIL_PLAN.md for the phase this sub-issue belongs to and its success criteria.")
          else:
              print("- Start from the referenced PR/issue, inspect its checks, labels, and latest comments, then patch only the directly related files.")
          print("- Preserve the daily roadmap workflow contract: collect GitHub context, produce required roadmap sections, and update the existing daily issue instead of creating duplicates.")
          print("- If this item is already resolved by the time the automation runs, select the next open Anvil roadmap sub-issue first, then the next open PR, then the next open issue.")
          print()
          print("## Acceptance criteria")
          print("- [ ] The selected PR/issue has a concrete code or workflow change attached.")
          print("- [ ] Required GitHub checks pass for the resulting PR.")
          print("- [ ] The daily roadmap issue body is updated with the latest GitHub context rather than skipped.")
          print("- [ ] No new duplicate daily-roadmap failure issue is created for the same day.")
          print()
          print("## Validation")
          print("- `./actionlint .github/workflows/sparkleforge-daily-roadmap.yml .github/workflows/gemini-assistant.yml .github/workflows/opencode-auto-fix.yml .github/workflows/pr-merge-gate.yml`")
          print("- `UV_CACHE_DIR=/tmp/uv-cache uv run pytest tests/test_cli_entrypoints.py tests/test_open_code_agent_config.py tests/test_cli_result_handling.py`")
          print("- `git diff --check`")
          PY
            echo "status=fallback" >> "$GITHUB_OUTPUT"
          else
            echo "status=generated" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub issue
        id: create_issue
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          HAS_PAT: ${{ secrets.PAT != '' }}
          TODAY: ${{ steps.prompt.outputs.today }}
          STATUS: ${{ steps.research.outputs.status }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::error::PAT repository secret is required so roadmap issues are authored by the PAT owner instead of github-actions[bot]."
            exit 1
          fi

          RELIABILITY_LABEL="daily-roadmap-reliability"

          if [ "$STATUS" = "fallback" ]; then
            # Genuine CLI research failures are tracked as one recurring issue
            # (via label) instead of a fresh issue every day.
            EXISTING=$(gh issue list \
              --repo "${{ github.repository }}" \
              --state open \
              --label "$RELIABILITY_LABEL" \
              --json number \
              --jq '.[0].number // empty')
            if [ -n "$EXISTING" ]; then
              echo "Open daily-roadmap-reliability issue already exists: #$EXISTING; it will be updated."
            fi
          else
            EXISTING=$(gh issue list \
              --repo "${{ github.repository }}" \
              --state open \
              --search "sparkleforge-daily-roadmap:$TODAY in:body sort:created-desc" \
              --json number \
              --jq '[.[].number] | sort | .[0] // empty')
            if [ -n "$EXISTING" ]; then
              echo "Roadmap issue already exists for $TODAY: #$EXISTING; it will be updated."
            fi
          fi

          TITLE=$(sed -n '1s/^# *//p' sparkleforge-roadmap.md | head -c 180)
          if [ -z "$TITLE" ]; then
            TITLE="Daily SparkleForge improvement plan"
          fi
          SUBJECT=$(printf '%s\n' "$TITLE" | sed -E \
            -e 's/^[[:space:]]+|[[:space:]]+$//g' \
            -e 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}[[:space:]]*-[[:space:]]*//' \
            -e 's/[[:space:]]*\(#[0-9]+\)$//' \
            -e 's/[[:space:]]+/ /g' | tr '[:upper:]' '[:lower:]')
          if [ -z "$SUBJECT" ]; then
            echo "::error::Unable to derive a specific roadmap issue title."
            exit 1
          fi
          ISSUE_TYPE="feat"
          if [ "$STATUS" = "fallback" ]; then
            ISSUE_TYPE="fix"
          fi
          ISSUE_TITLE="$ISSUE_TYPE: $SUBJECT"
          python scripts/validate_commit_messages.py --message "$ISSUE_TITLE"

          if [ "$STATUS" = "fallback" ] && [ -n "$EXISTING" ]; then
            gh issue view "$EXISTING" --repo "${{ github.repository }}" --json body --jq '.body' > previous-issue-body.md || true
          else
            : > previous-issue-body.md
          fi

          python - <<'PY' > issue-body.md
          import os
          import re
          from pathlib import Path

          today = os.environ["TODAY"]
          status = os.environ["STATUS"]
          roadmap = Path("sparkleforge-roadmap.md").read_text(encoding="utf-8")

          print(f"<!-- sparkleforge-daily-roadmap:{today} -->")
          print()
          print("This issue was generated by the daily SparkleForge roadmap workflow.")
          print("It is intentionally scoped so the automated OpenCode workflow can create a branch, commit fixes, open a PR, and iterate on verification feedback.")
          print()

          if status == "fallback":
              previous = Path("previous-issue-body.md").read_text(encoding="utf-8") if Path("previous-issue-body.md").exists() else ""
              occurrences = re.findall(r"^- (\d{4}-\d{2}-\d{2})$", previous, flags=re.MULTILINE)
              if today not in occurrences:
                  occurrences.append(today)
              occurrences = occurrences[-10:]
              print("## Occurrence log")
              print("Recurring daily-roadmap generation failures are tracked in this single issue instead of one new issue per day.")
              for day in occurrences:
                  print(f"- {day}")
              print()

          print(roadmap)
          PY

          if [ "$STATUS" = "fallback" ]; then
            EXTRA_LABEL_ARGS=(--label "$RELIABILITY_LABEL")
          else
            EXTRA_LABEL_ARGS=()
          fi

          if [ -n "$EXISTING" ]; then
            if [ "$STATUS" = "fallback" ]; then
              gh issue edit "$EXISTING" \
                --repo "${{ github.repository }}" \
                --add-label "$RELIABILITY_LABEL" > /dev/null || true
            fi
            gh issue edit "$EXISTING" \
              --repo "${{ github.repository }}" \
              --title "$ISSUE_TITLE" \
              --body-file issue-body.md

            echo "Updated issue: #$EXISTING"
            echo "issue_number=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ISSUE_URL=$(gh issue create \
            --repo "${{ github.repository }}" \
            --title "$ISSUE_TITLE" \
            --body-file issue-body.md \
            "${EXTRA_LABEL_ARGS[@]}")

          ISSUE_NUMBER="${ISSUE_URL##*/}"
          echo "Created issue: $ISSUE_URL"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Sync Anvil roadmap doc
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          if [ ! -s anvil-milestone.json ] || [ "$(cat anvil-milestone.json)" = "" ]; then
            echo "No open Anvil milestone; nothing to sync."
            exit 0
          fi

          SYNC_STATUS=$(python - <<'PY'
          import json
          from pathlib import Path

          milestone = json.loads(Path("anvil-milestone.json").read_text(encoding="utf-8"))
          number = milestone["number"]
          sub_status = json.loads(Path("anvil-subissue-status.json").read_text(encoding="utf-8") or "[]")
          total = len(sub_status)
          closed = sum(1 for item in sub_status if item["state"] == "CLOSED")

          if total == 0 or closed == 0:
              print("nochange")
              raise SystemExit(0)

          new_status = "✅" if closed == total else f"🔲 진행 중 ({closed}/{total})"

          plan_path = Path("docs/ANVIL_PLAN.md")
          lines = plan_path.read_text(encoding="utf-8").splitlines()
          marker = f"마일스톤 #{number}"
          changed = False
          for i, line in enumerate(lines):
              if line.startswith("|") and marker in line:
                  cells = line.split("|")
                  if len(cells) >= 5 and cells[3].strip() != new_status:
                      cells[3] = f" {new_status} "
                      lines[i] = "|".join(cells)
                      changed = True

          if changed:
              plan_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
              print("changed")
          else:
              print("nochange")
          PY
          )
          echo "Anvil doc sync status: $SYNC_STATUS"

          if [ "$SYNC_STATUS" != "changed" ]; then
            exit 0
          fi

          MILESTONE_NUMBER=$(python -c "import json; print(json.load(open('anvil-milestone.json'))['number'])")
          SYNC_BRANCH="docs/anvil-sync-$MILESTONE_NUMBER"

          echo "Automated sync from the daily roadmap workflow. Updates the phase table status in docs/ANVIL_PLAN.md to reflect milestone #$MILESTONE_NUMBER sub-issue completion. Human review required before merge." > anvil-sync-pr-body.md

          uv run sparkleforge ci publish \
            --repo "${{ github.repository }}" \
            --branch "$SYNC_BRANCH" \
            --base main \
            --commit-title "docs: sync anvil phase status for milestone #$MILESTONE_NUMBER" \
            --paths docs/ANVIL_PLAN.md \
            --pr-title "docs: sync Anvil phase status for milestone #$MILESTONE_NUMBER" \
            --pr-body-file anvil-sync-pr-body.md

          git checkout main

      - name: Dispatch OpenCode follow-up
        if: steps.create_issue.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          gh workflow run opencode-auto-fix.yml \
            --repo "${{ github.repository }}" \
            --field issue_number="${{ steps.create_issue.outputs.issue_number }}" \
            --field max_iterations="${{ github.event.inputs.max_iterations || '3' }}" || true
          echo "Issue #${{ steps.create_issue.outputs.issue_number }} was created and dispatched to opencode-auto-fix.yml."
