name: SparkleForge Daily Roadmap Issue

on:
  schedule:
    # 00:30 Asia/Seoul every day.
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      max_iterations:
        description: 'Maximum OpenCode repair attempts after the issue is created'
        required: false
        default: '3'
        type: string

concurrency:
  group: sparkleforge-daily-roadmap-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

jobs:
  create-roadmap-issue:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    outputs:
      issue_number: ${{ steps.create_issue.outputs.issue_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v5

      - name: Install SparkleForge
        run: |
          uv sync

      - name: Prepare daily research prompt
        id: prompt
        run: |
          TODAY="$(TZ=Asia/Seoul date +%Y-%m-%d)"
          cat > daily-roadmap-prompt.md <<EOF
          You are SparkleForge running inside the SparkleForge repository on $TODAY.

          Gather and analyze current public information, recent news, and latest engineering trends for AI agents, coding agents, MCP/tool ecosystems, long-running autonomous workflows, eval-driven development, agent memory, browser/computer use, model routing, and GitHub automation.

          Then inspect the current project shape from the checked-out repository context and propose exactly one high-leverage, implementable improvement or feature for SparkleForge.

          The output will become a GitHub issue that an automated coding workflow will implement. Make it concrete and bounded.

          Required markdown structure:
          # <short actionable issue title>

          ## Why now
          - Include trend signals with dates and source URLs.
          - Explain why this matters for SparkleForge specifically.

          ## Proposed change
          - Describe one coherent feature, workflow upgrade, or larger refactor.
          - Keep it feasible for an automated PR.

          ## Implementation notes
          - Mention likely files or modules to inspect.
          - Include compatibility and safety constraints.

          ## Acceptance criteria
          - Provide a checklist of verifiable outcomes.

          ## Validation
          - State exact commands or checks the PR should run.
          EOF
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"

      - name: Collect GitHub planning context
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          TODAY: ${{ steps.prompt.outputs.today }}
        run: |
          {
            echo "## Current GitHub issue and PR context"
            echo
            echo "Use this repository context as the primary input for the daily roadmap. Prioritize unblocked, high-leverage work from these issues and PRs before proposing net-new ideas."
            echo
            echo "### Open pull requests"
          } > github-planning-context.md

          gh pr list \
            --repo "${{ github.repository }}" \
            --state open \
            --limit 40 \
            --json number,title,headRefName,baseRefName,isDraft,mergeStateStatus,updatedAt,labels \
            --jq '.[] | "- #\(.number) \(.title) [\(.headRefName) -> \(.baseRefName); draft=\(.isDraft); merge=\(.mergeStateStatus); updated=\(.updatedAt); labels=\([.labels[].name] | join(", "))]"' \
            > open-prs.md
          if [ ! -s open-prs.md ]; then
            echo "- No open pull requests." > open-prs.md
          fi
          cat open-prs.md >> github-planning-context.md

          {
            echo
            echo "### Open issues"
          } >> github-planning-context.md

          gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --limit 80 \
            --json number,title,updatedAt,labels,assignees \
            --jq '.[] | "- #\(.number) \(.title) [updated=\(.updatedAt); labels=\([.labels[].name] | join(", ")); assignees=\([.assignees[].login] | join(", "))]"' \
            > open-issues.md
          if [ ! -s open-issues.md ]; then
            echo "- No open issues." > open-issues.md
          fi
          cat open-issues.md >> github-planning-context.md

          {
            echo
            echo "### Daily selection rule"
            echo "- If a PR is open and blocked by a workflow or review failure, prefer a roadmap item that unblocks it."
            echo "- If repeated daily-roadmap failure issues are open, prefer a roadmap item that restores daily roadmap generation/update reliability."
            echo "- Do not create a generic trend-only item when a concrete open issue or PR is more actionable."
          } >> github-planning-context.md

          {
            echo
            cat github-planning-context.md
          } >> daily-roadmap-prompt.md

      - name: Run SparkleForge research
        id: research
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SPARKLEFORGE_CLI_INTERACTIVE: 'false'
          MCP_BUILDER_ENABLED: 'false'
          MCP_ALLOWED_SERVERS: 'local-search,search,web-fetch,arxiv,sparkleforge-skills'
          SPARKLEFORGE_ALLOWED_MCP_SERVERS: 'local-search,search,web-fetch,arxiv,sparkleforge-skills'
          SPARKLEFORGE_SKIP_ERA_FOR_MCP: 'true'
          SPARKLEFORGE_ENV: ${{ vars.SPARKLEFORGE_ENV || 'production' }}
        run: |
          set +e
          timeout 10m uv run python -m src.cli.entry run --max-tokens 4096 --model google/gemini-2.0-flash-exp \
            --output sparkleforge-roadmap.md --task "Anvil Phase Z-3: Physical / IoT Adapter" \
            --format markdown \
            < daily-roadmap-prompt.md > sparkleforge-roadmap-console.log \
            2> sparkleforge-roadmap-error.log
          RC=$?
          set -e

          OUTPUT_BYTES=$(wc -c < sparkleforge-roadmap.md 2>/dev/null || echo 0)
          CONSOLE_BYTES=$(wc -c < sparkleforge-roadmap-console.log 2>/dev/null || echo 0)
          ERROR_BYTES=$(wc -c < sparkleforge-roadmap-error.log 2>/dev/null || echo 0)
          INVALID_OUTPUT_REASON=""

          if [ -s sparkleforge-roadmap.md ]; then
            if grep -Fq "Generated roadmap based on:" sparkleforge-roadmap.md; then
              INVALID_OUTPUT_REASON="CLI produced placeholder roadmap text instead of a real SparkleForge analysis"
            elif grep -Fq "SparkleForge failed while generating the daily improvement roadmap." sparkleforge-roadmap.md; then
              INVALID_OUTPUT_REASON="CLI output was already a failure report"
            else
              for section in "## Why now" "## Proposed change" "## Implementation notes" "## Acceptance criteria" "## Validation"; do
                if ! grep -Fq "$section" sparkleforge-roadmap.md; then
                  INVALID_OUTPUT_REASON="CLI output is missing required section: $section"
                  break
                fi
              done
            fi
          fi

          if [ "$RC" -ne 0 ] || [ ! -s sparkleforge-roadmap.md ] || [ -n "$INVALID_OUTPUT_REASON" ]; then
            export DAILY_RC="$RC"
            export DAILY_OUTPUT_BYTES="$OUTPUT_BYTES"
            export DAILY_CONSOLE_BYTES="$CONSOLE_BYTES"
            export DAILY_ERROR_BYTES="$ERROR_BYTES"
            export DAILY_INVALID_OUTPUT_REASON="$INVALID_OUTPUT_REASON"
            python - <<'PY' > sparkleforge-roadmap.md
          import os
          import re
          from pathlib import Path

          context = Path("github-planning-context.md").read_text(encoding="utf-8")

          def collect(header: str, stop: str) -> list[str]:
              active = False
              rows = []
              for raw in context.splitlines():
                  line = raw.strip()
                  if line == header:
                      active = True
                      continue
                  if active and line == stop:
                      break
                  if active and line.startswith("- #"):
                      rows.append(line)
              return rows

          prs = collect("### Open pull requests", "### Open issues")
          issues = collect("### Open issues", "### Daily selection rule")
          if prs:
              target_kind = "pull request"
              target = prs[0]
          elif issues:
              target_kind = "issue"
              target = issues[0]
          else:
              target_kind = "repository backlog"
              target = "No open issue or pull request was returned by GitHub context collection."

          match = re.match(r"- #(?P<number>\d+) (?P<title>.*?) \[", target)
          number = match.group("number") if match else ""
          title = match.group("title") if match else "repository backlog"
          if target_kind == "pull request" and number:
              heading = f"Unblock pull request {number}"
              target_label = f"PR #{number}: {title}"
          elif target_kind == "issue" and number:
              heading = f"Triage issue {number}"
              target_label = f"Issue #{number}: {title}"
          else:
              heading = "Triage issue 13"
              target_label = title

          rc = os.getenv("DAILY_RC", "")
          invalid = os.getenv("DAILY_INVALID_OUTPUT_REASON", "")
          output_bytes = os.getenv("DAILY_OUTPUT_BYTES", "0")
          console_bytes = os.getenv("DAILY_CONSOLE_BYTES", "0")
          error_bytes = os.getenv("DAILY_ERROR_BYTES", "0")

          print(f"# {heading}")
          print()
          print("## Why now")
          print("- Daily roadmap generation must update the tracked GitHub issue even when the full SparkleForge research path is slow, unavailable, or returns invalid output.")
          print(f"- The live GitHub context collection selected {target_label} as the top actionable backlog item.")
          print(f"- SparkleForge CLI fallback metadata: exit code `{rc}`, output bytes `{output_bytes}`, console bytes `{console_bytes}`, error bytes `{error_bytes}`.")
          if invalid:
              print(f"- Invalid output reason: {invalid}.")
          print()
          print("## Proposed change")
          print(f"- Use the current repository issue/PR context to move {target_label} toward a mergeable or closable state.")
          print("- Keep the scope bounded to the smallest code, workflow, or documentation change needed to unblock that item.")
          print()
          print("## Implementation notes")
          print("- Start from the referenced PR/issue, inspect its checks, labels, and latest comments, then patch only the directly related files.")
          print("- Preserve the daily roadmap workflow contract: collect GitHub context, produce required roadmap sections, and update the existing daily issue instead of creating duplicates.")
          print("- If this item is already resolved by the time the automation runs, select the next open PR first, then the next open issue.")
          print()
          print("## Acceptance criteria")
          print("- [ ] The selected PR/issue has a concrete code or workflow change attached.")
          print("- [ ] Required GitHub checks pass for the resulting PR.")
          print("- [ ] The daily roadmap issue body is updated with the latest GitHub context rather than skipped.")
          print("- [ ] No new duplicate daily-roadmap failure issue is created for the same day.")
          print()
          print("## Validation")
          print("- `./actionlint .github/workflows/sparkleforge-daily-roadmap.yml .github/workflows/gemini-assistant.yml .github/workflows/opencode-auto-fix.yml .github/workflows/pr-merge-gate.yml`")
          print("- `UV_CACHE_DIR=/tmp/uv-cache uv run pytest tests/test_cli_entrypoints.py tests/test_open_code_agent_config.py tests/test_cli_result_handling.py`")
          print("- `git diff --check`")
          PY
            echo "status=fallback" >> "$GITHUB_OUTPUT"
          else
            echo "status=generated" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub issue
        id: create_issue
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          HAS_PAT: ${{ secrets.PAT != '' }}
          TODAY: ${{ steps.prompt.outputs.today }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::error::PAT repository secret is required so roadmap issues are authored by the PAT owner instead of github-actions[bot]."
            exit 1
          fi

          EXISTING=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --search "sparkleforge-daily-roadmap:$TODAY in:body" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "Roadmap issue already exists for $TODAY: #$EXISTING; it will be updated."
          fi

          if [ -z "$EXISTING" ] && [ "${{ steps.research.outputs.status }}" = "fallback" ]; then
            EXISTING_FIX=$(gh issue list \
              --repo "${{ github.repository }}" \
              --state open \
              --search 'daily roadmap in:title' \
              --json number \
              --jq '.[0].number // empty')
            if [ -n "$EXISTING_FIX" ]; then
              echo "Open daily roadmap issue already exists: #$EXISTING_FIX; it will be updated."
              EXISTING="$EXISTING_FIX"
            fi
          fi

          TITLE=$(sed -n '1s/^# *//p' sparkleforge-roadmap.md | head -c 180)
          if [ -z "$TITLE" ]; then
            TITLE="Daily SparkleForge improvement plan"
          fi
          ISSUE_TYPE="feat"
          if [ "${{ steps.research.outputs.status }}" = "fallback" ]; then
            ISSUE_TYPE="fix"
          fi
          SUBJECT=$(printf '%s\n' "$TITLE" | sed -E \
            -e 's/^[[:space:]]+|[[:space:]]+$//g' \
            -e 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}[[:space:]]*-[[:space:]]*//' \
            -e 's/[[:space:]]*\(#[0-9]+\)$//' \
            -e 's/[[:space:]]+/ /g' | tr '[:upper:]' '[:lower:]')
          if [ -z "$SUBJECT" ]; then
            echo "::error::Unable to derive a specific roadmap issue title."
            exit 1
          fi
          ISSUE_TITLE="$ISSUE_TYPE: $SUBJECT"
          python scripts/validate_commit_messages.py --message "$ISSUE_TITLE"

          {
            echo "<!-- sparkleforge-daily-roadmap:$TODAY -->"
            echo
            echo "This issue was generated by the daily SparkleForge roadmap workflow."
            echo "It is intentionally scoped so the automated OpenCode workflow can create a branch, commit fixes, open a PR, and iterate on verification feedback."
            echo
            cat sparkleforge-roadmap.md
          } > issue-body.md

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" \
              --repo "${{ github.repository }}" \
              --title "$ISSUE_TITLE" \
              --body-file issue-body.md

            echo "Updated issue: #$EXISTING"
            echo "issue_number=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ISSUE_URL=$(gh issue create \
            --repo "${{ github.repository }}" \
            --title "$ISSUE_TITLE" \
            --body-file issue-body.md)

          ISSUE_NUMBER="${ISSUE_URL##*/}"
          echo "Created issue: $ISSUE_URL"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch OpenCode follow-up
        if: steps.create_issue.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          gh workflow run opencode-auto-fix.yml \
            --repo "${{ github.repository }}" \
            --field issue_number="${{ steps.create_issue.outputs.issue_number }}" \
            --field max_iterations="${{ github.event.inputs.max_iterations || '3' }}" || true
          echo "Issue #${{ steps.create_issue.outputs.issue_number }} was created and dispatched to opencode-auto-fix.yml."
