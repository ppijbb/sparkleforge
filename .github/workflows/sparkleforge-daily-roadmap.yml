name: SparkleForge Daily Roadmap Issue

on:
  schedule:
    # 00:30 Asia/Seoul every day.
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      max_iterations:
        description: 'Maximum OpenCode repair attempts after the issue is created'
        required: false
        default: '3'
        type: string

concurrency:
  group: sparkleforge-daily-roadmap-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-roadmap-issue:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    outputs:
      issue_number: ${{ steps.create_issue.outputs.issue_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v5

      - name: Install SparkleForge
        run: |
          uv sync

      - name: Ensure daily-roadmap-reliability label exists
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          gh label create "daily-roadmap-reliability" \
            --repo "${{ github.repository }}" \
            --color "B60205" \
            --description "Recurring daily-roadmap generation failures tracked as one issue instead of one per day" \
            2>/dev/null || true

      - name: Prepare daily research prompt
        id: prompt
        run: |
          TODAY="$(TZ=Asia/Seoul date +%Y-%m-%d)"
          uv run sparkleforge report daily-roadmap-prompt --today "$TODAY" > daily-roadmap-prompt.md
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"

      - name: Collect GitHub planning context
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          TODAY: ${{ steps.prompt.outputs.today }}
        run: |
          {
            echo "## Current GitHub issue and PR context"
            echo
            echo "Use this repository context as the primary input for the daily roadmap. Prioritize unblocked, high-leverage work from these issues and PRs before proposing net-new ideas."
            echo
            echo "### Open pull requests"
          } > github-planning-context.md

          gh pr list \
            --repo "${{ github.repository }}" \
            --state open \
            --limit 40 \
            --json number,title,headRefName,baseRefName,isDraft,mergeStateStatus,updatedAt,labels \
            --jq '.[] | "- #\(.number) \(.title) [\(.headRefName) -> \(.baseRefName); draft=\(.isDraft); merge=\(.mergeStateStatus); updated=\(.updatedAt); labels=\([.labels[].name] | join(", "))]"' \
            > open-prs.md
          if [ ! -s open-prs.md ]; then
            echo "- No open pull requests." > open-prs.md
          fi
          cat open-prs.md >> github-planning-context.md

          {
            echo
            echo "### Open issues"
          } >> github-planning-context.md

          gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --limit 80 \
            --json number,title,updatedAt,labels,assignees \
            --jq '.[] | "- #\(.number) \(.title) [updated=\(.updatedAt); labels=\([.labels[].name] | join(", ")); assignees=\([.assignees[].login] | join(", "))]"' \
            > open-issues.md
          if [ ! -s open-issues.md ]; then
            echo "- No open issues." > open-issues.md
          fi
          cat open-issues.md >> github-planning-context.md

          {
            echo
            echo "### Anvil roadmap status"
          } >> github-planning-context.md

          gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --search "Milestone: in:title label:sparkleforge-roadmap sort:created-desc" \
            --json number,title,body \
            --jq '.[0] // empty' \
            > anvil-milestone.json

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          raw = Path("anvil-milestone.json").read_text(encoding="utf-8").strip()
          milestone = json.loads(raw) if raw else None

          numbers = []
          if milestone:
              numbers = sorted(set(int(n) for n in re.findall(r"[—-]\s*#(\d+)", milestone.get("body", ""))))

          text = "\n".join(str(n) for n in numbers)
          Path("anvil-subissue-numbers.txt").write_text(text + "\n" if text else "", encoding="utf-8")
          PY

          : > anvil-subissue-status.json
          if [ -s anvil-subissue-numbers.txt ]; then
            while IFS= read -r NUM || [ -n "$NUM" ]; do
              [ -z "$NUM" ] && continue
              ISSUE_JSON=$(gh issue view "$NUM" --repo "${{ github.repository }}" --json number,title,state 2>/dev/null || echo "")
              if [ -n "$ISSUE_JSON" ] && printf '%s' "$ISSUE_JSON" | jq -e . >/dev/null 2>&1; then
                printf '%s\n' "$ISSUE_JSON" >> anvil-subissue-status.json
              fi
            done < anvil-subissue-numbers.txt
          fi
          jq -s '.' anvil-subissue-status.json > anvil-subissue-status.json.tmp \
            && mv anvil-subissue-status.json.tmp anvil-subissue-status.json \
            || echo '[]' > anvil-subissue-status.json
          jq empty anvil-subissue-status.json

          uv run sparkleforge report roadmap-target \
            --milestone-file anvil-milestone.json \
            --subissue-status-file anvil-subissue-status.json \
            --target-out anvil-roadmap-target.md \
            >> github-planning-context.md

          if [ ! -f anvil-roadmap-target.md ]; then
            : > anvil-roadmap-target.md
          fi

          {
            echo
            echo "### Anvil roadmap document (docs/ANVIL_PLAN.md)"
            echo '```markdown'
            cat docs/ANVIL_PLAN.md
            echo '```'
          } >> github-planning-context.md

          {
            echo
            echo "### Daily selection rule"
            echo "- If '### Anvil roadmap status' lists a next open Anvil roadmap sub-issue, that is the required target for today: implement its concrete checklist items, don't propose something else instead."
            echo "- Only if no Anvil roadmap sub-issue is open: if a PR is open and blocked by a workflow or review failure, prefer a roadmap item that unblocks it."
            echo "- Only if neither of the above applies: propose a new item, but justify it against docs/ANVIL_PLAN.md section 4 so it extends the existing phase structure instead of ignoring it."
            echo "- If repeated daily-roadmap failure issues are open, prefer a roadmap item that restores daily roadmap generation/update reliability."
            echo "- If PR #1453 is open, prioritize unblocking it."
          } >> github-planning-context.md

          {
            echo
            cat github-planning-context.md
          } >> daily-roadmap-prompt.md

      - name: Run SparkleForge research
        id: research
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SPARKLEFORGE_CLI_INTERACTIVE: 'false'
          MCP_BUILDER_ENABLED: 'false'
          MCP_ALLOWED_SERVERS: 'local-search,search,web-fetch,arxiv,sparkleforge-skills'
          SPARKLEFORGE_ALLOWED_MCP_SERVERS: 'local-search,search,web-fetch,arxiv,sparkleforge-skills'
          SPARKLEFORGE_SKIP_ERA_FOR_MCP: 'true'
          SPARKLEFORGE_ENV: ${{ vars.SPARKLEFORGE_ENV || 'production' }}
        run: |
          set +e
          timeout 10m uv run python -m src.cli.entry run --max-tokens 4096 --model google/gemini-2.0-flash-exp \
            --output sparkleforge-roadmap.md --task "SparkleForge Daily Roadmap" \
            --format markdown \
            < daily-roadmap-prompt.md > sparkleforge-roadmap-console.log \
            2> sparkleforge-roadmap-error.log
          RC=$?
          set -e

          OUTPUT_BYTES=$(wc -c < sparkleforge-roadmap.md 2>/dev/null || echo 0)
          CONSOLE_BYTES=$(wc -c < sparkleforge-roadmap-console.log 2>/dev/null || echo 0)
          ERROR_BYTES=$(wc -c < sparkleforge-roadmap-error.log 2>/dev/null || echo 0)
          INVALID_OUTPUT_REASON=""

          if [ -s sparkleforge-roadmap.md ]; then
            if grep -Fq "Generated roadmap based on:" sparkleforge-roadmap.md; then
              INVALID_OUTPUT_REASON="CLI produced placeholder roadmap text instead of a real SparkleForge analysis"
            elif grep -Fq "SparkleForge failed while generating the daily improvement roadmap." sparkleforge-roadmap.md; then
              INVALID_OUTPUT_REASON="CLI output was already a failure report"
            else
              for section in "## Why now" "## Proposed change" "## Implementation notes" "## Acceptance criteria" "## Validation"; do
                if ! grep -Fq "$section" sparkleforge-roadmap.md; then
                  INVALID_OUTPUT_REASON="CLI output is missing required section: $section"
                  break
                fi
              done
            fi
          fi

          if [ "$RC" -ne 0 ] || [ ! -s sparkleforge-roadmap.md ] || [ -n "$INVALID_OUTPUT_REASON" ]; then
            uv run sparkleforge report roadmap-fallback-issue \
              --context-file github-planning-context.md \
              --anvil-target-file anvil-roadmap-target.md \
              --rc "$RC" \
              --invalid-reason "$INVALID_OUTPUT_REASON" \
              --output-bytes "$OUTPUT_BYTES" \
              --console-bytes "$CONSOLE_BYTES" \
              --error-bytes "$ERROR_BYTES" \
              > sparkleforge-roadmap.md
            echo "status=fallback" >> "$GITHUB_OUTPUT"
          else
            echo "status=generated" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub issue
        id: create_issue
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          HAS_PAT: ${{ secrets.PAT != '' }}
          TODAY: ${{ steps.prompt.outputs.today }}
          STATUS: ${{ steps.research.outputs.status }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::error::PAT repository secret is required so roadmap issues are authored by the PAT owner instead of github-actions[bot]."
            exit 1
          fi

          RELIABILITY_LABEL="daily-roadmap-reliability"

          if [ "$STATUS" = "fallback" ]; then
            # Genuine CLI research failures are tracked as one recurring issue
            # (via label) instead of a fresh issue every day.
            EXISTING=$(gh issue list \
              --repo "${{ github.repository }}" \
              --state open \
              --label "$RELIABILITY_LABEL" \
              --json number \
              --jq '.[0].number // empty')
            if [ -n "$EXISTING" ]; then
              echo "Open daily-roadmap-reliability issue already exists: #$EXISTING; it will be updated."
            fi
          else
            EXISTING=$(gh issue list \
              --repo "${{ github.repository }}" \
              --state open \
              --search "sparkleforge-daily-roadmap:$TODAY in:body sort:created-desc" \
              --json number \
              --jq '[.[].number] | sort | .[0] // empty')
            if [ -n "$EXISTING" ]; then
              echo "Roadmap issue already exists for $TODAY: #$EXISTING; it will be updated."
            fi
          fi

          TITLE=$(sed -n '1s/^# *//p' sparkleforge-roadmap.md | head -c 180)
          if [ -z "$TITLE" ]; then
            TITLE="Daily SparkleForge improvement plan"
          fi
          SUBJECT=$(printf '%s\n' "$TITLE" | sed -E \
            -e 's/^[[:space:]]+|[[:space:]]+$//g' \
            -e 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}[[:space:]]*-[[:space:]]*//' \
            -e 's/[[:space:]]*\(#[0-9]+\)$//' \
            -e 's/[[:space:]]+/ /g' | tr '[:upper:]' '[:lower:]')
          if [ -z "$SUBJECT" ]; then
            echo "::error::Unable to derive a specific roadmap issue title."
            exit 1
          fi
          ISSUE_TYPE="feat"
          if [ "$STATUS" = "fallback" ]; then
            ISSUE_TYPE="fix"
          fi
          ISSUE_TITLE="$ISSUE_TYPE: $SUBJECT"
          python scripts/validate_commit_messages.py --message "$ISSUE_TITLE"

          if [ "$STATUS" = "fallback" ] && [ -n "$EXISTING" ]; then
            gh issue view "$EXISTING" --repo "${{ github.repository }}" --json body --jq '.body' > previous-issue-body.md || true
          else
            : > previous-issue-body.md
          fi

          uv run sparkleforge report roadmap-issue-body \
            --today "$TODAY" \
            --status "$STATUS" \
            --roadmap-file sparkleforge-roadmap.md \
            --previous-body-file previous-issue-body.md \
            > issue-body.md

          if [ "$STATUS" = "fallback" ]; then
            EXTRA_LABEL_ARGS=(--label "$RELIABILITY_LABEL")
          else
            EXTRA_LABEL_ARGS=()
          fi

          if [ -n "$EXISTING" ]; then
            if [ "$STATUS" = "fallback" ]; then
              gh issue edit "$EXISTING" \
                --repo "${{ github.repository }}" \
                --add-label "$RELIABILITY_LABEL" > /dev/null || true
            fi
            gh issue edit "$EXISTING" \
              --repo "${{ github.repository }}" \
              --title "$ISSUE_TITLE" \
              --body-file issue-body.md

            echo "Updated issue: #$EXISTING"
            echo "issue_number=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ISSUE_URL=$(gh issue create \
            --repo "${{ github.repository }}" \
            --title "$ISSUE_TITLE" \
            --body-file issue-body.md \
            "${EXTRA_LABEL_ARGS[@]}")

          ISSUE_NUMBER="${ISSUE_URL##*/}"
          echo "Created issue: $ISSUE_URL"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Sync Anvil roadmap doc
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          if [ ! -s anvil-milestone.json ] || [ "$(cat anvil-milestone.json)" = "" ]; then
            echo "No open Anvil milestone; nothing to sync."
            exit 0
          fi

          SYNC_STATUS=$(uv run sparkleforge report sync-anvil-doc \
            --milestone-file anvil-milestone.json \
            --subissue-status-file anvil-subissue-status.json \
            --plan-file docs/ANVIL_PLAN.md)
          echo "Anvil doc sync status: $SYNC_STATUS"

          if [ "$SYNC_STATUS" != "changed" ]; then
            exit 0
          fi

          MILESTONE_NUMBER=$(python -c "import json; print(json.load(open('anvil-milestone.json'))['number'])")
          SYNC_BRANCH="docs/anvil-sync-$MILESTONE_NUMBER"

          echo "Automated sync from the daily roadmap workflow. Updates the phase table status in docs/ANVIL_PLAN.md to reflect milestone #$MILESTONE_NUMBER sub-issue completion. Human review required before merge." > anvil-sync-pr-body.md

          uv run sparkleforge ci publish \
            --repo "${{ github.repository }}" \
            --branch "$SYNC_BRANCH" \
            --base main \
            --commit-title "docs: sync anvil phase status for milestone #$MILESTONE_NUMBER" \
            --paths docs/ANVIL_PLAN.md \
            --pr-title "docs: sync Anvil phase status for milestone #$MILESTONE_NUMBER" \
            --pr-body-file anvil-sync-pr-body.md

          git checkout main

      - name: Dispatch OpenCode follow-up
        if: steps.create_issue.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          gh workflow run opencode-auto-fix.yml \
            --repo "${{ github.repository }}" \
            --field issue_number="${{ steps.create_issue.outputs.issue_number }}" \
            --field max_iterations="${{ github.event.inputs.max_iterations || '3' }}" || true
          echo "Issue #${{ steps.create_issue.outputs.issue_number }} was created and dispatched to opencode-auto-fix.yml."
